<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 360" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><title>PDCA サイクル</title><desc>Plan・Do・Check・Act の4段階を循環させ、ISMS を継続的に改善する流れを示す図。</desc><g font-family="sans-serif" font-size="13" fill="#262626"><defs><marker id="pdca-arrow-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#262626" stroke="none"/></marker><marker id="pdca-arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#686868" stroke="none"/></marker><marker id="pdca-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009689" stroke="none"/></marker><marker id="pdca-arrow-success" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#007a55" stroke="none"/></marker><marker id="pdca-arrow-warning" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bb4d00" stroke="none"/></marker><marker id="pdca-arrow-error" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c10007" stroke="none"/></marker><marker id="pdca-arrow-c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f54a00" stroke="none"/></marker><marker id="pdca-arrow-c2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009689" stroke="none"/></marker><marker id="pdca-arrow-c3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#104e64" stroke="none"/></marker><marker id="pdca-arrow-c4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb900" stroke="none"/></marker><marker id="pdca-arrow-c5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker><marker id="pdca-arrow-c6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker></defs><g fill="#262626"><rect x="285" y="10" width="190" height="62" rx="10" fill="#fe9a00" fill-opacity="0.1" stroke="#fe9a00" stroke-width="1.5"/><text x="380" y="39" text-anchor="middle" font-size="15" font-weight="600" fill="#262626">Plan（計画）</text><text x="380" y="57" text-anchor="middle" font-size="13" fill="#686868">リスク評価と計画策定</text></g><g fill="#262626"><rect x="545" y="140" width="190" height="62" rx="10" fill="#f54a00" fill-opacity="0.1" stroke="#f54a00" stroke-width="1.5"/><text x="640" y="169" text-anchor="middle" font-size="15" font-weight="600" fill="#262626">Do（実行）</text><text x="640" y="187" text-anchor="middle" font-size="13" fill="#686868">管理策の実施・運用</text></g><g fill="#262626"><rect x="285" y="272" width="190" height="62" rx="10" fill="#009689" fill-opacity="0.1" stroke="#009689" stroke-width="1.5"/><text x="380" y="301" text-anchor="middle" font-size="15" font-weight="600" fill="#262626">Check（評価）</text><text x="380" y="319" text-anchor="middle" font-size="13" fill="#686868">内部監査・レビュー</text></g><g fill="#262626"><rect x="25" y="140" width="190" height="62" rx="10" fill="#fe9a00" fill-opacity="0.1" stroke="#fe9a00" stroke-width="1.5"/><text x="120" y="169" text-anchor="middle" font-size="15" font-weight="600" fill="#262626">Act（改善）</text><text x="120" y="187" text-anchor="middle" font-size="13" fill="#686868">是正処置と見直し</text></g><circle cx="380" cy="172" r="72" fill="#009689" fill-opacity="0.08" stroke="#009689" stroke-width="1.5" stroke-dasharray="5 4"/><text x="380" y="152" text-anchor="middle" font-size="13" fill="#686868">ISMS</text><text x="380" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#262626">継続的改善</text><text x="380" y="198" text-anchor="middle" font-size="13" fill="#686868">PDCA を回す</text><line x1="470" y1="74" x2="547" y2="136" stroke="#686868" stroke-width="1.5" marker-end="url(#pdca-arrow-muted)" fill="#262626"/><line x1="620" y1="204" x2="480" y2="300" stroke="#686868" stroke-width="1.5" marker-end="url(#pdca-arrow-muted)" fill="#262626"/><line x1="283" y1="300" x2="220" y2="210" stroke="#686868" stroke-width="1.5" marker-end="url(#pdca-arrow-muted)" fill="#262626"/><line x1="140" y1="138" x2="292" y2="78" stroke="#686868" stroke-width="1.5" marker-end="url(#pdca-arrow-muted)" fill="#262626"/><text x="380" y="352" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">Check と Act を軽視すると、ISMS は形だけになる</text></g></svg>
