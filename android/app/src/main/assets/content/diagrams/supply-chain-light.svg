<svg viewBox="0 0 760 360" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><title>サプライチェーンと攻撃面</title><desc>委託先・クラウド事業者・ソフトウェア供給元・再委託先という外部依存と、そこから自社システムにリスクが連鎖する関係を示す図。</desc><g font-family="sans-serif" font-size="13" fill="#262626"><defs><marker id="sc-arrow-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#262626" stroke="none"/></marker><marker id="sc-arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#686868" stroke="none"/></marker><marker id="sc-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009689" stroke="none"/></marker><marker id="sc-arrow-success" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#007a55" stroke="none"/></marker><marker id="sc-arrow-warning" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bb4d00" stroke="none"/></marker><marker id="sc-arrow-error" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c10007" stroke="none"/></marker><marker id="sc-arrow-c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f54a00" stroke="none"/></marker><marker id="sc-arrow-c2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009689" stroke="none"/></marker><marker id="sc-arrow-c3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#104e64" stroke="none"/></marker><marker id="sc-arrow-c4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb900" stroke="none"/></marker><marker id="sc-arrow-c5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker><marker id="sc-arrow-c6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker></defs><text x="380" y="32" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">外部の委託先・クラウド・ソフトウェアを経由してリスクが連鎖する</text><g fill="#262626"><rect x="40" y="64" width="190" height="64" rx="10" fill="#bb4d00" fill-opacity="0.1" stroke="#bb4d00" stroke-width="1.5" stroke-dasharray="5 4"/><text x="135" y="94" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">委託先</text><text x="135" y="112" text-anchor="middle" font-size="13" fill="#686868">SIer・運用委託</text></g><g fill="#262626"><rect x="285" y="64" width="190" height="64" rx="10" fill="#bb4d00" fill-opacity="0.1" stroke="#bb4d00" stroke-width="1.5" stroke-dasharray="5 4"/><text x="380" y="94" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">クラウド事業者</text><text x="380" y="112" text-anchor="middle" font-size="13" fill="#686868">IaaS / SaaS</text></g><g fill="#262626"><rect x="530" y="64" width="190" height="64" rx="10" fill="#bb4d00" fill-opacity="0.1" stroke="#bb4d00" stroke-width="1.5" stroke-dasharray="5 4"/><text x="625" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#262626">ソフトウェア供給元</text><text x="625" y="112" text-anchor="middle" font-size="13" fill="#686868">OSS・パッケージ</text></g><g fill="#262626"><rect x="290" y="190" width="180" height="68" rx="10" fill="#009689" fill-opacity="0.1" stroke="#009689" stroke-width="1.5"/><text x="380" y="222" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">自社システム</text><text x="380" y="240" text-anchor="middle" font-size="13" fill="#686868">情報資産</text></g><g fill="#262626"><rect x="40" y="282" width="190" height="60" rx="10" fill="#bb4d00" fill-opacity="0.1" stroke="#bb4d00" stroke-width="1.5" stroke-dasharray="5 4"/><text x="135" y="310" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">再委託先</text><text x="135" y="328" text-anchor="middle" font-size="13" fill="#686868">委託先の委託先</text></g><line x1="135" y1="128" x2="330" y2="186" stroke="#bb4d00" stroke-width="1.5" marker-end="url(#sc-arrow-warning)" fill="#262626"/><line x1="380" y1="128" x2="380" y2="186" stroke="#bb4d00" stroke-width="1.5" marker-end="url(#sc-arrow-warning)" fill="#262626"/><line x1="625" y1="128" x2="430" y2="186" stroke="#bb4d00" stroke-width="1.5" marker-end="url(#sc-arrow-warning)" fill="#262626"/><line x1="135" y1="282" x2="135" y2="132" stroke="#bb4d00" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#sc-arrow-warning)" fill="#262626"/><text x="145" y="210" text-anchor="start" font-size="13" font-weight="400" fill="#686868">再委託</text><text x="380" y="300" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">点線の枠＝攻撃面になり得る外部依存先</text><text x="380" y="324" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">契約・監査・SBOM・脆弱性管理で継続的に確認する</text></g></svg>
