<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 360" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><title>RPO と RTO</title><desc>最後のバックアップから障害発生までを RPO、障害発生からサービス再開までを RTO として、時間軸上に対応させた図。</desc><g font-family="sans-serif" font-size="13" fill="#262626"><defs><marker id="rpo-arrow-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#262626" stroke="none"/></marker><marker id="rpo-arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#686868" stroke="none"/></marker><marker id="rpo-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009689" stroke="none"/></marker><marker id="rpo-arrow-success" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#007a55" stroke="none"/></marker><marker id="rpo-arrow-warning" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bb4d00" stroke="none"/></marker><marker id="rpo-arrow-error" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c10007" stroke="none"/></marker><marker id="rpo-arrow-c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f54a00" stroke="none"/></marker><marker id="rpo-arrow-c2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009689" stroke="none"/></marker><marker id="rpo-arrow-c3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#104e64" stroke="none"/></marker><marker id="rpo-arrow-c4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb900" stroke="none"/></marker><marker id="rpo-arrow-c5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker><marker id="rpo-arrow-c6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker></defs><text x="380" y="32" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">RPO は失ってよいデータの範囲、RTO は停止してよい時間の範囲を表す</text><rect x="130" y="182" width="170" height="16" fill="#c10007" fill-opacity="0.18" stroke="none"/><rect x="300" y="182" width="240" height="16" fill="#bb4d00" fill-opacity="0.18" stroke="none"/><line x1="48" y1="190" x2="704" y2="190" stroke="#686868" stroke-width="1.5" marker-end="url(#rpo-arrow-muted)" fill="#262626"/><text x="700" y="178" text-anchor="end" font-size="13" font-weight="400" fill="#686868">時間</text><line x1="130" y1="122" x2="130" y2="204" stroke="#e5e5e5" stroke-width="1.5" stroke-dasharray="5 4" fill="#262626"/><line x1="300" y1="108" x2="300" y2="204" stroke="#c10007" stroke-width="1.5" stroke-dasharray="5 4" fill="#262626"/><line x1="540" y1="108" x2="540" y2="204" stroke="#007a55" stroke-width="1.5" stroke-dasharray="5 4" fill="#262626"/><circle cx="130" cy="190" r="4" fill="#fe9a00" stroke="none"/><circle cx="300" cy="190" r="4" fill="#c10007" stroke="none"/><circle cx="540" cy="190" r="4" fill="#007a55" stroke="none"/><path d="M 130 142 V 158 M 130 150 H 296 M 296 142 V 158" fill="none" stroke="#c10007" stroke-width="1.5"/><path d="M 304 142 V 158 M 304 150 H 540 M 540 142 V 158" fill="none" stroke="#bb4d00" stroke-width="1.5"/><text x="215" y="128" text-anchor="middle" font-size="13" font-weight="400" fill="#c10007">RPO：目標復旧時点</text><text x="215" y="176" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">失ってよいデータ量</text><text x="420" y="128" text-anchor="middle" font-size="13" font-weight="400" fill="#bb4d00">RTO：目標復旧時間</text><text x="420" y="176" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">停止してよい時間</text><text x="130" y="222" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">最終バックアップ</text><text x="300" y="222" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">障害発生</text><text x="540" y="222" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">サービス再開</text><g fill="#262626"><rect x="48" y="246" width="330" height="76" rx="14" fill="#f5f5f5" fill-opacity="0.55" stroke="#ebebeb" stroke-width="1.5"/><text x="64" y="270" font-size="13" font-weight="600" fill="#262626">RPO を小さくする</text></g><text x="64" y="296" text-anchor="start" font-size="13" font-weight="400" fill="#686868">バックアップ間隔を短くする</text><text x="64" y="316" text-anchor="start" font-size="13" font-weight="400" fill="#686868">ログを継続的に取得する</text><g fill="#262626"><rect x="400" y="246" width="330" height="76" rx="14" fill="#f5f5f5" fill-opacity="0.55" stroke="#ebebeb" stroke-width="1.5"/><text x="416" y="270" font-size="13" font-weight="600" fill="#262626">RTO を小さくする</text></g><text x="416" y="296" text-anchor="start" font-size="13" font-weight="400" fill="#686868">機器の冗長化と自動切替</text><text x="416" y="316" text-anchor="start" font-size="13" font-weight="400" fill="#686868">復旧手順の整備と演習</text><text x="380" y="344" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">目標は業務影響から決め、演習で達成できるか確認する</text></g></svg>
