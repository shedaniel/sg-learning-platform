<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 360" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><title>アクセス制御モデル</title><desc>主体が資源へのアクセスを要求し、ポリシーに基づく判断を経て許可・拒否される流れと、最小権限・Need-to-Knowの原則を示す図。</desc><g font-family="sans-serif" font-size="13" fill="#f5f5f5"><defs><marker id="ac-arrow-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f5f5f5" stroke="none"/></marker><marker id="ac-arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#818181" stroke="none"/></marker><marker id="ac-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00bc7d" stroke="none"/></marker><marker id="ac-arrow-success" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00d492" stroke="none"/></marker><marker id="ac-arrow-warning" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb900" stroke="none"/></marker><marker id="ac-arrow-error" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6467" stroke="none"/></marker><marker id="ac-arrow-c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1447e6" stroke="none"/></marker><marker id="ac-arrow-c2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00bc7d" stroke="none"/></marker><marker id="ac-arrow-c3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker><marker id="ac-arrow-c4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ad46ff" stroke="none"/></marker><marker id="ac-arrow-c5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff2056" stroke="none"/></marker><marker id="ac-arrow-c6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff2056" stroke="none"/></marker></defs><text x="380" y="32" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">アクセス制御は「主体・資源・操作」の組で可否を判断し、必要な権限だけを与える</text><g fill="#f5f5f5"><rect x="30" y="136" width="150" height="72" rx="10" fill="#ff2056" fill-opacity="0.1" stroke="#ff2056" stroke-width="1.5"/><text x="105" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">主体</text><text x="105" y="188" text-anchor="middle" font-size="13" fill="#818181">利用者・端末</text></g><g fill="#f5f5f5"><rect x="270" y="126" width="220" height="92" rx="10" fill="#00bc7d" fill-opacity="0.1" stroke="#00bc7d" stroke-width="1.5"/><text x="380" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">ポリシー判断</text><text x="380" y="188" text-anchor="middle" font-size="13" fill="#818181">誰が・何に・何を</text></g><g fill="#f5f5f5"><rect x="580" y="136" width="150" height="72" rx="10" fill="#1447e6" fill-opacity="0.1" stroke="#1447e6" stroke-width="1.5"/><text x="655" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">資源</text><text x="655" y="188" text-anchor="middle" font-size="13" fill="#818181">ファイル・DB</text></g><line x1="180" y1="172" x2="266" y2="172" stroke="#00bc7d" stroke-width="1.5" marker-end="url(#ac-arrow-accent)" fill="#f5f5f5"/><line x1="490" y1="172" x2="576" y2="172" stroke="#00bc7d" stroke-width="1.5" marker-end="url(#ac-arrow-accent)" fill="#f5f5f5"/><text x="225" y="116" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">① 要求</text><text x="535" y="116" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">② 許可/拒否</text><g fill="#f5f5f5"><rect x="270" y="258" width="220" height="64" rx="10" fill="#00bc7d" fill-opacity="0.1" stroke="#00bc7d" stroke-width="1.5"/><text x="380" y="288" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">ポリシー</text><text x="380" y="306" text-anchor="middle" font-size="13" fill="#818181">最小権限・職務分離</text></g><line x1="380" y1="258" x2="380" y2="222" stroke="#00bc7d" stroke-width="1.5" marker-end="url(#ac-arrow-c2)" fill="#f5f5f5"/><text x="392" y="244" text-anchor="start" font-size="13" font-weight="400" fill="#818181">ポリシー参照</text><g fill="#f5f5f5"><rect x="30" y="250" width="220" height="80" rx="14" fill="#1d1d1d" fill-opacity="0.55" stroke="#222222" stroke-width="1.5"/><text x="46" y="274" font-size="13" font-weight="600" fill="#f5f5f5">原則</text></g><text x="46" y="298" text-anchor="start" font-size="13" font-weight="400" fill="#818181">最小権限：必要な権限だけ</text><text x="46" y="318" text-anchor="start" font-size="13" font-weight="400" fill="#818181">Need-to-Know：必要時のみ</text><g fill="#f5f5f5"><rect x="540" y="250" width="190" height="80" rx="14" fill="#1d1d1d" fill-opacity="0.55" stroke="#222222" stroke-width="1.5"/><text x="556" y="274" font-size="13" font-weight="600" fill="#f5f5f5">権限の見直し</text></g><text x="556" y="298" text-anchor="start" font-size="13" font-weight="400" fill="#818181">退職・異動時は即時削除</text><text x="556" y="318" text-anchor="start" font-size="13" font-weight="400" fill="#818181">定期的に棚卸しする</text><text x="380" y="348" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">判断結果はログに記録し、監査できるようにする</text></g></svg>
