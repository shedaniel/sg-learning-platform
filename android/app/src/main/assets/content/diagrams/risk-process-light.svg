<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 360" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><title>リスクマネジメントプロセス</title><desc>リスクの特定・分析・評価・対応を進め、監視とコミュニケーションで次のサイクルにつなげる流れを示す図。</desc><g font-family="sans-serif" font-size="13" fill="#262626"><defs><marker id="riskp-arrow-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#262626" stroke="none"/></marker><marker id="riskp-arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#686868" stroke="none"/></marker><marker id="riskp-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009689" stroke="none"/></marker><marker id="riskp-arrow-success" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#007a55" stroke="none"/></marker><marker id="riskp-arrow-warning" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bb4d00" stroke="none"/></marker><marker id="riskp-arrow-error" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c10007" stroke="none"/></marker><marker id="riskp-arrow-c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f54a00" stroke="none"/></marker><marker id="riskp-arrow-c2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009689" stroke="none"/></marker><marker id="riskp-arrow-c3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#104e64" stroke="none"/></marker><marker id="riskp-arrow-c4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb900" stroke="none"/></marker><marker id="riskp-arrow-c5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker><marker id="riskp-arrow-c6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker></defs><text x="380" y="44" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">リスク基準（許容水準）を先に定め、評価結果を対応につなげる</text><g fill="#262626"><rect x="22" y="76" width="164" height="76" rx="10" fill="#fe9a00" fill-opacity="0.1" stroke="#fe9a00" stroke-width="1.5"/><text x="104" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">① 特定</text><text x="104" y="130" text-anchor="middle" font-size="13" fill="#686868">資産・脅威・脆弱性</text></g><g fill="#262626"><rect x="206" y="76" width="164" height="76" rx="10" fill="#104e64" fill-opacity="0.1" stroke="#104e64" stroke-width="1.5"/><text x="288" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">② 分析</text><text x="288" y="130" text-anchor="middle" font-size="13" fill="#686868">発生可能性 × 影響</text></g><g fill="#262626"><rect x="390" y="76" width="164" height="76" rx="10" fill="#009689" fill-opacity="0.1" stroke="#009689" stroke-width="1.5"/><text x="472" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">③ 評価</text><text x="472" y="130" text-anchor="middle" font-size="13" fill="#686868">基準と比較し優先度付け</text></g><g fill="#262626"><rect x="574" y="76" width="164" height="76" rx="10" fill="#bb4d00" fill-opacity="0.1" stroke="#bb4d00" stroke-width="1.5"/><text x="656" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">④ 対応</text><text x="656" y="130" text-anchor="middle" font-size="13" fill="#686868">回避・低減・移転・受容</text></g><line x1="186" y1="114" x2="202" y2="114" stroke="#686868" stroke-width="1.5" marker-end="url(#riskp-arrow-muted)" fill="#262626"/><line x1="370" y1="114" x2="386" y2="114" stroke="#686868" stroke-width="1.5" marker-end="url(#riskp-arrow-muted)" fill="#262626"/><line x1="554" y1="114" x2="570" y2="114" stroke="#686868" stroke-width="1.5" marker-end="url(#riskp-arrow-muted)" fill="#262626"/><g fill="#262626"><rect x="470" y="246" width="210" height="62" rx="10" fill="#fe9a00" fill-opacity="0.1" stroke="#fe9a00" stroke-width="1.5"/><text x="575" y="275" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">リスク監視・レビュー</text><text x="575" y="293" text-anchor="middle" font-size="13" fill="#686868">残留リスクの確認</text></g><g fill="#262626"><rect x="140" y="246" width="200" height="62" rx="10" fill="#f54a00" fill-opacity="0.1" stroke="#f54a00" stroke-width="1.5"/><text x="240" y="275" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">リスクコミュニケーション</text><text x="240" y="293" text-anchor="middle" font-size="13" fill="#686868">関係者への共有・協議</text></g><path d="M 656 152 V 206 H 575 V 242" fill="none" stroke="#686868" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#riskp-arrow-muted)"/><path d="M 140 277 H 96 V 158" fill="none" stroke="#686868" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#riskp-arrow-muted)"/><text x="380" y="334" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">PDCA を回しながら、リスクの変化に応じて見直す</text></g></svg>
