<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 360" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><title>ハッシュとデジタル署名</title><desc>メッセージをハッシュ化し、秘密鍵で署名して送信し、受信側がハッシュを再計算して公開鍵で検証する流れを示す図。</desc><g font-family="sans-serif" font-size="13" fill="#f5f5f5"><defs><marker id="hash-arrow-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f5f5f5" stroke="none"/></marker><marker id="hash-arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#818181" stroke="none"/></marker><marker id="hash-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00bc7d" stroke="none"/></marker><marker id="hash-arrow-success" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00d492" stroke="none"/></marker><marker id="hash-arrow-warning" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb900" stroke="none"/></marker><marker id="hash-arrow-error" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6467" stroke="none"/></marker><marker id="hash-arrow-c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1447e6" stroke="none"/></marker><marker id="hash-arrow-c2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00bc7d" stroke="none"/></marker><marker id="hash-arrow-c3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker><marker id="hash-arrow-c4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ad46ff" stroke="none"/></marker><marker id="hash-arrow-c5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff2056" stroke="none"/></marker><marker id="hash-arrow-c6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff2056" stroke="none"/></marker></defs><text x="380" y="30" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">ハッシュは改ざん検知、デジタル署名は本人確認と改ざん検知を同時に実現する</text><text x="40" y="56" text-anchor="start" font-size="13" font-weight="400" fill="#818181">署名する側</text><g fill="#f5f5f5"><rect x="40" y="68" width="140" height="56" rx="10" fill="#ff2056" fill-opacity="0.1" stroke="#ff2056" stroke-width="1.5"/><text x="110" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">① メッセージ</text><text x="110" y="112" text-anchor="middle" font-size="13" fill="#818181">改ざん検知の対象</text></g><g fill="#f5f5f5"><rect x="230" y="68" width="150" height="56" rx="10" fill="#fe9a00" fill-opacity="0.1" stroke="#fe9a00" stroke-width="1.5"/><text x="305" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">② ハッシュ化</text><text x="305" y="112" text-anchor="middle" font-size="13" fill="#818181">SHA-256 など</text></g><g fill="#f5f5f5"><rect x="430" y="68" width="170" height="56" rx="10" fill="#00bc7d" fill-opacity="0.1" stroke="#00bc7d" stroke-width="1.5"/><text x="515" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">③ 署名生成</text><text x="515" y="112" text-anchor="middle" font-size="13" fill="#818181">秘密鍵で署名</text></g><line x1="180" y1="96" x2="226" y2="96" stroke="#818181" stroke-width="1.5" marker-end="url(#hash-arrow-muted)" fill="#f5f5f5"/><line x1="380" y1="96" x2="426" y2="96" stroke="#818181" stroke-width="1.5" marker-end="url(#hash-arrow-muted)" fill="#f5f5f5"/><text x="40" y="232" text-anchor="start" font-size="13" font-weight="400" fill="#818181">検証する側</text><g fill="#f5f5f5"><rect x="40" y="244" width="150" height="56" rx="10" fill="#ff2056" fill-opacity="0.1" stroke="#ff2056" stroke-width="1.5"/><text x="115" y="270" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">④ 受信データ</text><text x="115" y="288" text-anchor="middle" font-size="13" fill="#818181">メッセージ + 署名</text></g><g fill="#f5f5f5"><rect x="230" y="244" width="150" height="56" rx="10" fill="#fe9a00" fill-opacity="0.1" stroke="#fe9a00" stroke-width="1.5"/><text x="305" y="277" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">⑤ ハッシュ再計算</text></g><g fill="#f5f5f5"><rect x="430" y="244" width="170" height="56" rx="10" fill="#00bc7d" fill-opacity="0.1" stroke="#00bc7d" stroke-width="1.5"/><text x="515" y="270" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">⑥ 署名検証</text><text x="515" y="288" text-anchor="middle" font-size="13" fill="#818181">公開鍵で照合</text></g><g fill="#f5f5f5"><rect x="630" y="244" width="100" height="56" rx="10" fill="#00d492" fill-opacity="0.1" stroke="#00d492" stroke-width="1.5"/><text x="680" y="270" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">⑦ 判定</text><text x="680" y="288" text-anchor="middle" font-size="13" fill="#818181">一致/不一致</text></g><line x1="190" y1="272" x2="226" y2="272" stroke="#818181" stroke-width="1.5" marker-end="url(#hash-arrow-muted)" fill="#f5f5f5"/><line x1="380" y1="272" x2="426" y2="272" stroke="#818181" stroke-width="1.5" marker-end="url(#hash-arrow-muted)" fill="#f5f5f5"/><line x1="600" y1="272" x2="626" y2="272" stroke="#818181" stroke-width="1.5" marker-end="url(#hash-arrow-muted)" fill="#f5f5f5"/><line x1="110" y1="124" x2="110" y2="240" stroke="#818181" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#hash-arrow-muted)" fill="#f5f5f5"/><line x1="515" y1="124" x2="515" y2="240" stroke="#818181" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#hash-arrow-muted)" fill="#f5f5f5"/><text x="122" y="186" text-anchor="start" font-size="13" font-weight="400" fill="#818181">送信</text><text x="527" y="186" text-anchor="start" font-size="13" font-weight="400" fill="#818181">署名を添付</text><text x="380" y="336" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">ハッシュが一致すれば改ざんはなく、署名が通れば本人が作成したと判断できる</text></g></svg>
