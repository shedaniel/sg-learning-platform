<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 360" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><title>ゼロトラスト</title><desc>利用者・端末・ネットワークの情報をもとに毎回のアクセスを検証し、ログ監視で継続的に評価するゼロトラストの構成を示す図。</desc><g font-family="sans-serif" font-size="13" fill="#262626"><defs><marker id="zt-arrow-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#262626" stroke="none"/></marker><marker id="zt-arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#686868" stroke="none"/></marker><marker id="zt-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009689" stroke="none"/></marker><marker id="zt-arrow-success" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#007a55" stroke="none"/></marker><marker id="zt-arrow-warning" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bb4d00" stroke="none"/></marker><marker id="zt-arrow-error" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c10007" stroke="none"/></marker><marker id="zt-arrow-c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f54a00" stroke="none"/></marker><marker id="zt-arrow-c2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009689" stroke="none"/></marker><marker id="zt-arrow-c3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#104e64" stroke="none"/></marker><marker id="zt-arrow-c4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb900" stroke="none"/></marker><marker id="zt-arrow-c5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker><marker id="zt-arrow-c6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker></defs><text x="380" y="32" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">社内ネットワークも信頼せず、アクセスのたびに本人・端末・状況を検証する</text><g fill="#262626"><rect x="90" y="58" width="170" height="60" rx="10" fill="#fe9a00" fill-opacity="0.1" stroke="#fe9a00" stroke-width="1.5"/><text x="175" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#262626">アイデンティティ</text><text x="175" y="104" text-anchor="middle" font-size="13" fill="#686868">利用者の認証</text></g><g fill="#262626"><rect x="295" y="58" width="150" height="60" rx="10" fill="#104e64" fill-opacity="0.1" stroke="#104e64" stroke-width="1.5"/><text x="370" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#262626">端末</text><text x="370" y="104" text-anchor="middle" font-size="13" fill="#686868">健全性の確認</text></g><g fill="#262626"><rect x="470" y="58" width="160" height="60" rx="10" fill="#fe9a00" fill-opacity="0.1" stroke="#fe9a00" stroke-width="1.5"/><text x="550" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#262626">ネットワーク</text><text x="550" y="104" text-anchor="middle" font-size="13" fill="#686868">経路と暗号化</text></g><g fill="#262626"><rect x="270" y="150" width="220" height="72" rx="10" fill="#009689" fill-opacity="0.1" stroke="#009689" stroke-width="1.5"/><text x="380" y="184" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">ポリシー判断</text><text x="380" y="202" text-anchor="middle" font-size="13" fill="#686868">毎回の認証・認可</text></g><g fill="#262626"><rect x="20" y="156" width="130" height="60" rx="10" fill="#f5f5f5" fill-opacity="0.65" stroke="#e5e5e5" stroke-width="1.5"/><text x="85" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="#262626">利用者</text><text x="85" y="202" text-anchor="middle" font-size="13" fill="#686868">社内外を問わず</text></g><g fill="#262626"><rect x="610" y="156" width="130" height="60" rx="10" fill="#f54a00" fill-opacity="0.1" stroke="#f54a00" stroke-width="1.5"/><text x="675" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="#262626">資源</text><text x="675" y="202" text-anchor="middle" font-size="13" fill="#686868">アプリ・データ</text></g><line x1="175" y1="118" x2="300" y2="146" stroke="#686868" stroke-width="1.5" marker-end="url(#zt-arrow-muted)" fill="#262626"/><line x1="370" y1="118" x2="370" y2="146" stroke="#686868" stroke-width="1.5" marker-end="url(#zt-arrow-muted)" fill="#262626"/><line x1="550" y1="118" x2="460" y2="146" stroke="#686868" stroke-width="1.5" marker-end="url(#zt-arrow-muted)" fill="#262626"/><line x1="150" y1="186" x2="266" y2="186" stroke="#009689" stroke-width="1.5" marker-end="url(#zt-arrow-accent)" fill="#262626"/><text x="210" y="174" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">① 要求</text><line x1="490" y1="186" x2="606" y2="186" stroke="#009689" stroke-width="1.5" marker-end="url(#zt-arrow-accent)" fill="#262626"/><text x="550" y="174" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">② 許可/拒否</text><g fill="#262626"><rect x="300" y="270" width="190" height="58" rx="10" fill="#bb4d00" fill-opacity="0.1" stroke="#bb4d00" stroke-width="1.5"/><text x="395" y="297" text-anchor="middle" font-size="13" font-weight="600" fill="#262626">ログ・テレメトリ</text><text x="395" y="315" text-anchor="middle" font-size="13" fill="#686868">監視と異常検知</text></g><line x1="395" y1="270" x2="395" y2="226" stroke="#bb4d00" stroke-width="1.5" marker-end="url(#zt-arrow-warning)" fill="#262626"/><text x="408" y="252" text-anchor="start" font-size="13" font-weight="400" fill="#686868">継続的に評価</text><g fill="#262626"><rect x="20" y="270" width="250" height="58" rx="14" fill="#f5f5f5" fill-opacity="0.55" stroke="#ebebeb" stroke-width="1.5"/><text x="36" y="294" font-size="13" font-weight="600" fill="#262626">暗黙の信頼を排除</text></g><text x="36" y="314" text-anchor="start" font-size="13" font-weight="400" fill="#686868">ネットワーク位置は根拠にしない</text><text x="620" y="290" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">侵害される前提で</text><text x="620" y="310" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">設計・監視する</text><text x="380" y="342" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">単一の境界防御ではなく、認証・認可・監視を組み合わせる</text></g></svg>
