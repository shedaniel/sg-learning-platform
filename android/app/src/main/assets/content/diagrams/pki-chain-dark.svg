<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 360" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><title>PKI の信頼の連鎖</title><desc>ルート CA が中間 CA に署名し、中間 CA がサーバ証明書に署名する連鎖と、CRL・OCSP による失効確認を示す図。</desc><g font-family="sans-serif" font-size="13" fill="#f5f5f5"><defs><marker id="pki-arrow-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f5f5f5" stroke="none"/></marker><marker id="pki-arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#818181" stroke="none"/></marker><marker id="pki-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00bc7d" stroke="none"/></marker><marker id="pki-arrow-success" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00d492" stroke="none"/></marker><marker id="pki-arrow-warning" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb900" stroke="none"/></marker><marker id="pki-arrow-error" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6467" stroke="none"/></marker><marker id="pki-arrow-c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1447e6" stroke="none"/></marker><marker id="pki-arrow-c2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00bc7d" stroke="none"/></marker><marker id="pki-arrow-c3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker><marker id="pki-arrow-c4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ad46ff" stroke="none"/></marker><marker id="pki-arrow-c5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff2056" stroke="none"/></marker><marker id="pki-arrow-c6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff2056" stroke="none"/></marker></defs><text x="380" y="32" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">サーバ証明書は中間 CA を経てルート CA につながり、その連鎖を検証する</text><rect x="24" y="68" width="222" height="104" rx="16" fill="#00bc7d" fill-opacity="0.05" stroke="#00bc7d" stroke-width="1.5" stroke-dasharray="6 5"/><text x="135" y="60" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">トラストアンカー</text><g fill="#f5f5f5"><rect x="40" y="84" width="190" height="72" rx="10" fill="#00bc7d" fill-opacity="0.1" stroke="#00bc7d" stroke-width="1.5"/><text x="135" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">ルート CA</text><text x="135" y="136" text-anchor="middle" font-size="13" fill="#818181">自己署名・信頼の起点</text></g><g fill="#f5f5f5"><rect x="285" y="84" width="190" height="72" rx="10" fill="#ff2056" fill-opacity="0.1" stroke="#ff2056" stroke-width="1.5"/><text x="380" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">中間 CA</text><text x="380" y="136" text-anchor="middle" font-size="13" fill="#818181">ルート CA が署名</text></g><g fill="#f5f5f5"><rect x="530" y="84" width="190" height="72" rx="10" fill="#1447e6" fill-opacity="0.1" stroke="#1447e6" stroke-width="1.5"/><text x="625" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">サーバ証明書</text><text x="625" y="136" text-anchor="middle" font-size="13" fill="#818181">中間 CA が署名</text></g><line x1="230" y1="120" x2="281" y2="120" stroke="#00bc7d" stroke-width="1.5" marker-end="url(#pki-arrow-accent)" fill="#f5f5f5"/><line x1="475" y1="120" x2="526" y2="120" stroke="#00bc7d" stroke-width="1.5" marker-end="url(#pki-arrow-accent)" fill="#f5f5f5"/><text x="257" y="110" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">署名</text><text x="502" y="110" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">署名</text><text x="380" y="192" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">検証は逆方向：サーバ証明書 → 中間 CA → ルート CA</text><g fill="#f5f5f5"><rect x="24" y="216" width="344" height="100" rx="14" fill="#1d1d1d" fill-opacity="0.55" stroke="#222222" stroke-width="1.5"/><text x="40" y="240" font-size="14" font-weight="600" fill="#f5f5f5">失効確認（CRL / OCSP）</text></g><text x="40" y="262" text-anchor="start" font-size="13" font-weight="400" fill="#818181">CRL：失効した証明書のリストを取得</text><text x="40" y="284" text-anchor="start" font-size="13" font-weight="400" fill="#818181">OCSP：証明書ごとに有効性を照会</text><text x="40" y="306" text-anchor="start" font-size="13" font-weight="400" fill="#818181">失効済みの証明書は信頼しない</text><g fill="#f5f5f5"><rect x="392" y="216" width="344" height="100" rx="14" fill="#1d1d1d" fill-opacity="0.55" stroke="#222222" stroke-width="1.5"/><text x="408" y="240" font-size="14" font-weight="600" fill="#f5f5f5">連鎖の検証</text></g><text x="408" y="264" text-anchor="start" font-size="13" font-weight="400" fill="#818181">① サーバ証明書 → 中間 CA の公開鍵</text><text x="408" y="284" text-anchor="start" font-size="13" font-weight="400" fill="#818181">② 中間 CA → ルート CA の公開鍵</text><text x="408" y="304" text-anchor="start" font-size="13" font-weight="400" fill="#818181">③ ルート CA は信頼ストアに登録済み</text><line x1="625" y1="156" x2="625" y2="212" stroke="#818181" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#pki-arrow-muted)" fill="#f5f5f5"/><text x="380" y="342" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">ルート CA の秘密鍵はオフラインで厳重に保管する</text></g></svg>
