<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 360" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><title>ISMS の体系</title><desc>ISO/IEC 27001 の要求事項を中心に、27002 の管理策、27014 のガバナンス、27017 のクラウド管理策の関係を示す図。</desc><g font-family="sans-serif" font-size="13" fill="#262626"><defs><marker id="isms-arrow-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#262626" stroke="none"/></marker><marker id="isms-arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#686868" stroke="none"/></marker><marker id="isms-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009689" stroke="none"/></marker><marker id="isms-arrow-success" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#007a55" stroke="none"/></marker><marker id="isms-arrow-warning" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bb4d00" stroke="none"/></marker><marker id="isms-arrow-error" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c10007" stroke="none"/></marker><marker id="isms-arrow-c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f54a00" stroke="none"/></marker><marker id="isms-arrow-c2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009689" stroke="none"/></marker><marker id="isms-arrow-c3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#104e64" stroke="none"/></marker><marker id="isms-arrow-c4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb900" stroke="none"/></marker><marker id="isms-arrow-c5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker><marker id="isms-arrow-c6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker></defs><g fill="#262626"><rect x="30" y="16" width="700" height="52" rx="14" fill="#009689" fill-opacity="0.07" stroke="#009689" stroke-width="1.5"/><text x="46" y="40" font-size="14" font-weight="600" fill="#262626">ISO/IEC 27014（情報セキュリティガバナンス）</text><text x="46" y="60" font-size="13" fill="#686868">経営層が方針を示し、実施状況を監視する</text></g><g fill="#262626"><rect x="30" y="84" width="440" height="208" rx="14" fill="#f5f5f5" fill-opacity="0.55" stroke="#ebebeb" stroke-width="1.5"/><text x="46" y="108" font-size="14" font-weight="600" fill="#262626">ISO/IEC 27001（ISMS 要求事項）</text><text x="46" y="128" font-size="13" fill="#686868">4〜10 の箇条でマネジメントシステムを要求</text></g><g fill="#262626"><rect x="46" y="140" width="196" height="30" rx="8" fill="#f5f5f5" fill-opacity="0.65" stroke="#e5e5e5" stroke-width="1.5"/><text x="144" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="#262626">4 組織の状況</text></g><g fill="#262626"><rect x="250" y="140" width="196" height="30" rx="8" fill="#f5f5f5" fill-opacity="0.65" stroke="#e5e5e5" stroke-width="1.5"/><text x="348" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="#262626">5 リーダーシップ</text></g><g fill="#262626"><rect x="46" y="178" width="196" height="30" rx="8" fill="#f5f5f5" fill-opacity="0.65" stroke="#e5e5e5" stroke-width="1.5"/><text x="144" y="198" text-anchor="middle" font-size="13" font-weight="600" fill="#262626">6 計画</text></g><g fill="#262626"><rect x="250" y="178" width="196" height="30" rx="8" fill="#f5f5f5" fill-opacity="0.65" stroke="#e5e5e5" stroke-width="1.5"/><text x="348" y="198" text-anchor="middle" font-size="13" font-weight="600" fill="#262626">7 支援</text></g><g fill="#262626"><rect x="46" y="216" width="196" height="30" rx="8" fill="#f5f5f5" fill-opacity="0.65" stroke="#e5e5e5" stroke-width="1.5"/><text x="144" y="236" text-anchor="middle" font-size="13" font-weight="600" fill="#262626">8 運用</text></g><g fill="#262626"><rect x="250" y="216" width="196" height="30" rx="8" fill="#f5f5f5" fill-opacity="0.65" stroke="#e5e5e5" stroke-width="1.5"/><text x="348" y="236" text-anchor="middle" font-size="13" font-weight="600" fill="#262626">9 パフォーマンス評価</text></g><g fill="#262626"><rect x="46" y="254" width="196" height="30" rx="8" fill="#f5f5f5" fill-opacity="0.65" stroke="#e5e5e5" stroke-width="1.5"/><text x="144" y="274" text-anchor="middle" font-size="13" font-weight="600" fill="#262626">10 改善</text></g><g fill="#262626"><rect x="490" y="84" width="240" height="120" rx="14" fill="#f5f5f5" fill-opacity="0.55" stroke="#ebebeb" stroke-width="1.5"/><text x="506" y="108" font-size="14" font-weight="600" fill="#262626">ISO/IEC 27002（管理策）</text><text x="506" y="128" font-size="13" fill="#686868">27001 を支える実施の手引き</text></g><g fill="#262626"><rect x="506" y="140" width="104" height="26" rx="8" fill="#f5f5f5" fill-opacity="0.65" stroke="#e5e5e5" stroke-width="1.5"/><text x="558" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#262626">組織的</text></g><g fill="#262626"><rect x="618" y="140" width="104" height="26" rx="8" fill="#f5f5f5" fill-opacity="0.65" stroke="#e5e5e5" stroke-width="1.5"/><text x="670" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#262626">人的</text></g><g fill="#262626"><rect x="506" y="174" width="104" height="26" rx="8" fill="#f5f5f5" fill-opacity="0.65" stroke="#e5e5e5" stroke-width="1.5"/><text x="558" y="192" text-anchor="middle" font-size="13" font-weight="600" fill="#262626">物理的</text></g><g fill="#262626"><rect x="618" y="174" width="104" height="26" rx="8" fill="#f5f5f5" fill-opacity="0.65" stroke="#e5e5e5" stroke-width="1.5"/><text x="670" y="192" text-anchor="middle" font-size="13" font-weight="600" fill="#262626">技術的</text></g><g fill="#262626"><rect x="490" y="216" width="240" height="76" rx="14" fill="#f5f5f5" fill-opacity="0.55" stroke="#ebebeb" stroke-width="1.5"/><text x="506" y="240" font-size="14" font-weight="600" fill="#262626">ISO/IEC 27017（クラウド）</text></g><text x="506" y="260" text-anchor="start" font-size="13" font-weight="400" fill="#686868">クラウドサービス特有の管理策</text><text x="506" y="280" text-anchor="start" font-size="13" font-weight="400" fill="#686868">27002 に追加して適用する</text><line x1="380" y1="68" x2="380" y2="80" stroke="#686868" stroke-width="1.5" marker-end="url(#isms-arrow-muted)" fill="#262626"/><line x1="470" y1="150" x2="486" y2="150" stroke="#686868" stroke-width="1.5" marker-end="url(#isms-arrow-muted)" fill="#262626"/><line x1="470" y1="254" x2="486" y2="254" stroke="#686868" stroke-width="1.5" marker-end="url(#isms-arrow-muted)" fill="#262626"/><text x="380" y="322" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">27001 が「何をすべきか」、27002・27017 が「どう実施するか」、27014 が経営の関与を示す</text></g></svg>
