<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 360" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><title>認証の3要素と多要素認証</title><desc>記憶・所有・生体の3つの認証要素と、異なる要素を組み合わせる多要素認証、同じ要素を重ねてもMFAにならない例を示す図。</desc><g font-family="sans-serif" font-size="13" fill="#f5f5f5"><defs><marker id="auth-arrow-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f5f5f5" stroke="none"/></marker><marker id="auth-arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#818181" stroke="none"/></marker><marker id="auth-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00bc7d" stroke="none"/></marker><marker id="auth-arrow-success" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00d492" stroke="none"/></marker><marker id="auth-arrow-warning" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb900" stroke="none"/></marker><marker id="auth-arrow-error" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6467" stroke="none"/></marker><marker id="auth-arrow-c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1447e6" stroke="none"/></marker><marker id="auth-arrow-c2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00bc7d" stroke="none"/></marker><marker id="auth-arrow-c3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker><marker id="auth-arrow-c4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ad46ff" stroke="none"/></marker><marker id="auth-arrow-c5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff2056" stroke="none"/></marker><marker id="auth-arrow-c6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff2056" stroke="none"/></marker></defs><text x="380" y="32" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">認証の 3 要素は知識・所持・生体。異なる要素を 2 つ以上組み合わせる</text><g fill="#f5f5f5"><rect x="40" y="58" width="210" height="88" rx="10" fill="#ff2056" fill-opacity="0.1" stroke="#ff2056" stroke-width="1.5"/><text x="145" y="90" text-anchor="middle" font-size="15" font-weight="600" fill="#f5f5f5">記憶（知識）</text><text x="145" y="110" text-anchor="middle" font-size="13" fill="#818181">パスワード・PIN</text><text x="145" y="128" text-anchor="middle" font-size="13" fill="#818181">忘れる・使い回し</text></g><g fill="#f5f5f5"><rect x="275" y="58" width="210" height="88" rx="10" fill="#fe9a00" fill-opacity="0.1" stroke="#fe9a00" stroke-width="1.5"/><text x="380" y="90" text-anchor="middle" font-size="15" font-weight="600" fill="#f5f5f5">所有（所持）</text><text x="380" y="110" text-anchor="middle" font-size="13" fill="#818181">IC カード・スマホ</text><text x="380" y="128" text-anchor="middle" font-size="13" fill="#818181">紛失・盗難の危険</text></g><g fill="#f5f5f5"><rect x="510" y="58" width="210" height="88" rx="10" fill="#1447e6" fill-opacity="0.1" stroke="#1447e6" stroke-width="1.5"/><text x="615" y="90" text-anchor="middle" font-size="15" font-weight="600" fill="#f5f5f5">生体（特性）</text><text x="615" y="110" text-anchor="middle" font-size="13" fill="#818181">指紋・顔・静脈</text><text x="615" y="128" text-anchor="middle" font-size="13" fill="#818181">変更不可・誤認識</text></g><g fill="#f5f5f5"><rect x="40" y="170" width="680" height="150" rx="14" fill="#00bc7d" fill-opacity="0.07" stroke="#00bc7d" stroke-width="1.5"/><text x="56" y="194" font-size="14" font-weight="600" fill="#f5f5f5">多要素認証（MFA）：異なる要素を組み合わせる</text></g><g fill="#f5f5f5"><rect x="60" y="210" width="200" height="88" rx="10" fill="#00d492" fill-opacity="0.1" stroke="#00d492" stroke-width="1.5"/><text x="160" y="242" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">知識 + 所持</text><text x="160" y="262" text-anchor="middle" font-size="13" fill="#818181">パスワード + スマホ</text><text x="160" y="280" text-anchor="middle" font-size="13" fill="#00d492">○ MFA として有効</text></g><g fill="#f5f5f5"><rect x="280" y="210" width="200" height="88" rx="10" fill="#00d492" fill-opacity="0.1" stroke="#00d492" stroke-width="1.5"/><text x="380" y="242" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">知識 + 生体</text><text x="380" y="262" text-anchor="middle" font-size="13" fill="#818181">パスワード + 指紋</text><text x="380" y="280" text-anchor="middle" font-size="13" fill="#00d492">○ MFA として有効</text></g><g fill="#f5f5f5"><rect x="500" y="210" width="200" height="88" rx="10" fill="#ff6467" fill-opacity="0.1" stroke="#ff6467" stroke-width="1.5"/><text x="600" y="242" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">知識 + 知識</text><text x="600" y="262" text-anchor="middle" font-size="13" fill="#818181">パスワード + 秘密の質問</text><text x="600" y="280" text-anchor="middle" font-size="13" fill="#ff6467">× 同一要素で MFA でない</text></g><text x="380" y="342" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">パスワードレス認証は所持と生体を組み合わせて実現する</text></g></svg>
