<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 360" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><title>クラウドの責任共有モデル</title><desc>IaaS・PaaS・SaaSの3形態について、利用者と事業者の責任範囲がどこで分かれるかを横棒で示す図。</desc><g font-family="sans-serif" font-size="13" fill="#f5f5f5"><defs><marker id="cloud-arrow-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f5f5f5" stroke="none"/></marker><marker id="cloud-arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#818181" stroke="none"/></marker><marker id="cloud-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00bc7d" stroke="none"/></marker><marker id="cloud-arrow-success" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00d492" stroke="none"/></marker><marker id="cloud-arrow-warning" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb900" stroke="none"/></marker><marker id="cloud-arrow-error" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6467" stroke="none"/></marker><marker id="cloud-arrow-c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1447e6" stroke="none"/></marker><marker id="cloud-arrow-c2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00bc7d" stroke="none"/></marker><marker id="cloud-arrow-c3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker><marker id="cloud-arrow-c4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ad46ff" stroke="none"/></marker><marker id="cloud-arrow-c5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff2056" stroke="none"/></marker><marker id="cloud-arrow-c6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff2056" stroke="none"/></marker></defs><text x="380" y="30" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">責任共有モデル：サービス形態が上がるほど、事業者の管理範囲が広がる</text><text x="40" y="59" text-anchor="start" font-size="13" font-weight="400" fill="#818181">サービスモデル</text><rect x="560" y="46" width="16" height="16" rx="3" fill="#ff2056" fill-opacity="0.25" stroke="#ff2056" stroke-width="1.5"/><text x="582" y="59" text-anchor="start" font-size="13" font-weight="400" fill="#818181">利用者</text><rect x="660" y="46" width="16" height="16" rx="3" fill="#1447e6" fill-opacity="0.2" stroke="#1447e6" stroke-width="1.5"/><text x="682" y="59" text-anchor="start" font-size="13" font-weight="400" fill="#818181">事業者</text><g fill="#f5f5f5"><g fill="#f5f5f5"><rect x="30" y="72" width="140" height="48" rx="10" fill="#1d1d1d" fill-opacity="0.65" stroke="#272727" stroke-width="1.5"/><text x="100" y="94" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">IaaS</text><text x="100" y="112" text-anchor="middle" font-size="13" fill="#818181">仮想マシン</text></g><rect x="180" y="72" width="410" height="48" rx="8" fill="#ff2056" fill-opacity="0.16" stroke="#ff2056" stroke-width="1.5"/><rect x="590" y="72" width="140" height="48" rx="8" fill="#1447e6" fill-opacity="0.14" stroke="#1447e6" stroke-width="1.5"/><text x="192" y="101" font-size="13" fill="#f5f5f5">ゲスト OS・ミドルウェア・アプリ・データ</text><text x="600" y="101" font-size="13" fill="#f5f5f5">仮想化・物理基盤</text></g><g fill="#f5f5f5"><g fill="#f5f5f5"><rect x="30" y="132" width="140" height="48" rx="10" fill="#1d1d1d" fill-opacity="0.65" stroke="#272727" stroke-width="1.5"/><text x="100" y="154" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">PaaS</text><text x="100" y="172" text-anchor="middle" font-size="13" fill="#818181">実行環境</text></g><rect x="180" y="132" width="260" height="48" rx="8" fill="#ff2056" fill-opacity="0.16" stroke="#ff2056" stroke-width="1.5"/><rect x="440" y="132" width="290" height="48" rx="8" fill="#1447e6" fill-opacity="0.14" stroke="#1447e6" stroke-width="1.5"/><text x="192" y="161" font-size="13" fill="#f5f5f5">アプリ・データ</text><text x="450" y="161" font-size="13" fill="#f5f5f5">OS・実行環境・基盤</text></g><g fill="#f5f5f5"><g fill="#f5f5f5"><rect x="30" y="192" width="140" height="48" rx="10" fill="#1d1d1d" fill-opacity="0.65" stroke="#272727" stroke-width="1.5"/><text x="100" y="214" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">SaaS</text><text x="100" y="232" text-anchor="middle" font-size="13" fill="#818181">アプリ</text></g><rect x="180" y="192" width="130" height="48" rx="8" fill="#ff2056" fill-opacity="0.16" stroke="#ff2056" stroke-width="1.5"/><rect x="310" y="192" width="420" height="48" rx="8" fill="#1447e6" fill-opacity="0.14" stroke="#1447e6" stroke-width="1.5"/><text x="192" y="221" font-size="13" fill="#f5f5f5">データ・設定</text><text x="320" y="221" font-size="13" fill="#f5f5f5">アプリ・OS・基盤すべて</text></g><text x="380" y="282" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">データ・アカウント・アクセス設定の管理は、どのモデルでも利用者の責任</text><text x="380" y="306" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">IaaS は OS 以上、PaaS はアプリ以上、SaaS は設定以上が利用者側</text></g></svg>
