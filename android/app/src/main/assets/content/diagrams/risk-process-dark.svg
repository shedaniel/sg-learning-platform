<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 360" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><title>リスクマネジメントプロセス</title><desc>リスクの特定・分析・評価・対応を進め、監視とコミュニケーションで次のサイクルにつなげる流れを示す図。</desc><g font-family="sans-serif" font-size="13" fill="#f5f5f5"><defs><marker id="riskp-arrow-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f5f5f5" stroke="none"/></marker><marker id="riskp-arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#818181" stroke="none"/></marker><marker id="riskp-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00bc7d" stroke="none"/></marker><marker id="riskp-arrow-success" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00d492" stroke="none"/></marker><marker id="riskp-arrow-warning" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb900" stroke="none"/></marker><marker id="riskp-arrow-error" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6467" stroke="none"/></marker><marker id="riskp-arrow-c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1447e6" stroke="none"/></marker><marker id="riskp-arrow-c2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00bc7d" stroke="none"/></marker><marker id="riskp-arrow-c3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker><marker id="riskp-arrow-c4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ad46ff" stroke="none"/></marker><marker id="riskp-arrow-c5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff2056" stroke="none"/></marker><marker id="riskp-arrow-c6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff2056" stroke="none"/></marker></defs><text x="380" y="44" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">リスク基準（許容水準）を先に定め、評価結果を対応につなげる</text><g fill="#f5f5f5"><rect x="22" y="76" width="164" height="76" rx="10" fill="#ff2056" fill-opacity="0.1" stroke="#ff2056" stroke-width="1.5"/><text x="104" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">① 特定</text><text x="104" y="130" text-anchor="middle" font-size="13" fill="#818181">資産・脅威・脆弱性</text></g><g fill="#f5f5f5"><rect x="206" y="76" width="164" height="76" rx="10" fill="#fe9a00" fill-opacity="0.1" stroke="#fe9a00" stroke-width="1.5"/><text x="288" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">② 分析</text><text x="288" y="130" text-anchor="middle" font-size="13" fill="#818181">発生可能性 × 影響</text></g><g fill="#f5f5f5"><rect x="390" y="76" width="164" height="76" rx="10" fill="#00bc7d" fill-opacity="0.1" stroke="#00bc7d" stroke-width="1.5"/><text x="472" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">③ 評価</text><text x="472" y="130" text-anchor="middle" font-size="13" fill="#818181">基準と比較し優先度付け</text></g><g fill="#f5f5f5"><rect x="574" y="76" width="164" height="76" rx="10" fill="#ffb900" fill-opacity="0.1" stroke="#ffb900" stroke-width="1.5"/><text x="656" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">④ 対応</text><text x="656" y="130" text-anchor="middle" font-size="13" fill="#818181">回避・低減・移転・受容</text></g><line x1="186" y1="114" x2="202" y2="114" stroke="#818181" stroke-width="1.5" marker-end="url(#riskp-arrow-muted)" fill="#f5f5f5"/><line x1="370" y1="114" x2="386" y2="114" stroke="#818181" stroke-width="1.5" marker-end="url(#riskp-arrow-muted)" fill="#f5f5f5"/><line x1="554" y1="114" x2="570" y2="114" stroke="#818181" stroke-width="1.5" marker-end="url(#riskp-arrow-muted)" fill="#f5f5f5"/><g fill="#f5f5f5"><rect x="470" y="246" width="210" height="62" rx="10" fill="#ff2056" fill-opacity="0.1" stroke="#ff2056" stroke-width="1.5"/><text x="575" y="275" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">リスク監視・レビュー</text><text x="575" y="293" text-anchor="middle" font-size="13" fill="#818181">残留リスクの確認</text></g><g fill="#f5f5f5"><rect x="140" y="246" width="200" height="62" rx="10" fill="#1447e6" fill-opacity="0.1" stroke="#1447e6" stroke-width="1.5"/><text x="240" y="275" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">リスクコミュニケーション</text><text x="240" y="293" text-anchor="middle" font-size="13" fill="#818181">関係者への共有・協議</text></g><path d="M 656 152 V 206 H 575 V 242" fill="none" stroke="#818181" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#riskp-arrow-muted)"/><path d="M 140 277 H 96 V 158" fill="none" stroke="#818181" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#riskp-arrow-muted)"/><text x="380" y="334" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">PDCA を回しながら、リスクの変化に応じて見直す</text></g></svg>
