<svg viewBox="0 0 760 400" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><title>CIA トライアド</title><desc>情報資産を中心に、機密性・完全性・可用性の3特性が重なり合い、真正性と責任追跡性が外側から支える関係を示す図。</desc><g font-family="sans-serif" font-size="13" fill="#262626"><defs><marker id="cia-arrow-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#262626" stroke="none"/></marker><marker id="cia-arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#686868" stroke="none"/></marker><marker id="cia-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009689" stroke="none"/></marker><marker id="cia-arrow-success" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#007a55" stroke="none"/></marker><marker id="cia-arrow-warning" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bb4d00" stroke="none"/></marker><marker id="cia-arrow-error" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c10007" stroke="none"/></marker><marker id="cia-arrow-c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f54a00" stroke="none"/></marker><marker id="cia-arrow-c2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009689" stroke="none"/></marker><marker id="cia-arrow-c3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#104e64" stroke="none"/></marker><marker id="cia-arrow-c4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb900" stroke="none"/></marker><marker id="cia-arrow-c5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker><marker id="cia-arrow-c6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker></defs><rect x="16" y="34" width="728" height="352" rx="20" fill="none" stroke="#686868" stroke-opacity="0.45" stroke-dasharray="6 5"/><text x="380" y="58" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">真正性・責任追跡性：なりすましを防ぎ、操作の記録をたどれる</text><circle cx="380" cy="150" r="86" fill="#f54a00" fill-opacity="0.07" stroke="#f54a00" stroke-width="1.5"/><circle cx="300" cy="258" r="86" fill="#104e64" fill-opacity="0.07" stroke="#104e64" stroke-width="1.5"/><circle cx="460" cy="258" r="86" fill="#fe9a00" fill-opacity="0.07" stroke="#fe9a00" stroke-width="1.5"/><text x="380" y="112" text-anchor="middle" font-size="16" font-weight="600" fill="#262626">機密性</text><text x="380" y="132" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">許可された人だけ</text><text x="300" y="288" text-anchor="middle" font-size="16" font-weight="600" fill="#262626">完全性</text><text x="300" y="308" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">改ざんを防ぐ</text><text x="460" y="288" text-anchor="middle" font-size="16" font-weight="600" fill="#262626">可用性</text><text x="460" y="308" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">止まらず使える</text><g fill="#262626"><rect x="316" y="202" width="128" height="58" rx="12" fill="#ffffff" stroke="#009689" stroke-width="1.5"/><text x="380" y="227" text-anchor="middle" font-size="15" font-weight="600" fill="#262626">情報資産</text><text x="380" y="246" text-anchor="middle" font-size="13" fill="#686868">保護対象</text></g><text x="380" y="372" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">3 特性のどれが損なわれるかを、事故ごとに判断する</text></g></svg>
