<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 360" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><title>データ保護ライフサイクル</title><desc>個人データの収集・分類・保存・利用・共有・保持・廃棄の各段階と、全段階に適用する安全管理措置を示す図。</desc><g font-family="sans-serif" font-size="13" fill="#f5f5f5"><defs><marker id="dp-arrow-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f5f5f5" stroke="none"/></marker><marker id="dp-arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#818181" stroke="none"/></marker><marker id="dp-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00bc7d" stroke="none"/></marker><marker id="dp-arrow-success" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00d492" stroke="none"/></marker><marker id="dp-arrow-warning" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb900" stroke="none"/></marker><marker id="dp-arrow-error" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6467" stroke="none"/></marker><marker id="dp-arrow-c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1447e6" stroke="none"/></marker><marker id="dp-arrow-c2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00bc7d" stroke="none"/></marker><marker id="dp-arrow-c3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker><marker id="dp-arrow-c4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ad46ff" stroke="none"/></marker><marker id="dp-arrow-c5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff2056" stroke="none"/></marker><marker id="dp-arrow-c6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff2056" stroke="none"/></marker></defs><text x="380" y="30" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">個人データは収集から廃棄までのライフサイクル全体で保護する</text><g fill="#f5f5f5"><rect x="30" y="64" width="160" height="68" rx="10" fill="#ff2056" fill-opacity="0.1" stroke="#ff2056" stroke-width="1.5"/><text x="110" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">① 収集</text><text x="110" y="114" text-anchor="middle" font-size="13" fill="#818181">目的の特定・最小化</text></g><g fill="#f5f5f5"><rect x="210" y="64" width="160" height="68" rx="10" fill="#fe9a00" fill-opacity="0.1" stroke="#fe9a00" stroke-width="1.5"/><text x="290" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">② 分類</text><text x="290" y="114" text-anchor="middle" font-size="13" fill="#818181">機密度の設定</text></g><g fill="#f5f5f5"><rect x="390" y="64" width="160" height="68" rx="10" fill="#1447e6" fill-opacity="0.1" stroke="#1447e6" stroke-width="1.5"/><text x="470" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">③ 保存</text><text x="470" y="114" text-anchor="middle" font-size="13" fill="#818181">暗号化・権限制御</text></g><g fill="#f5f5f5"><rect x="570" y="64" width="160" height="68" rx="10" fill="#00bc7d" fill-opacity="0.1" stroke="#00bc7d" stroke-width="1.5"/><text x="650" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">④ 利用</text><text x="650" y="114" text-anchor="middle" font-size="13" fill="#818181">目的内での利用</text></g><line x1="190" y1="98" x2="206" y2="98" stroke="#818181" stroke-width="1.5" marker-end="url(#dp-arrow-muted)" fill="#f5f5f5"/><line x1="370" y1="98" x2="386" y2="98" stroke="#818181" stroke-width="1.5" marker-end="url(#dp-arrow-muted)" fill="#f5f5f5"/><line x1="550" y1="98" x2="566" y2="98" stroke="#818181" stroke-width="1.5" marker-end="url(#dp-arrow-muted)" fill="#f5f5f5"/><g fill="#f5f5f5"><rect x="570" y="204" width="160" height="68" rx="10" fill="#ff2056" fill-opacity="0.1" stroke="#ff2056" stroke-width="1.5"/><text x="650" y="236" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">⑤ 共有</text><text x="650" y="254" text-anchor="middle" font-size="13" fill="#818181">契約・同意の確認</text></g><g fill="#f5f5f5"><rect x="390" y="204" width="160" height="68" rx="10" fill="#ad46ff" fill-opacity="0.1" stroke="#ad46ff" stroke-width="1.5"/><text x="470" y="236" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">⑥ 保持</text><text x="470" y="254" text-anchor="middle" font-size="13" fill="#818181">保存期間の設定</text></g><g fill="#f5f5f5"><rect x="210" y="204" width="160" height="68" rx="10" fill="#ff6467" fill-opacity="0.1" stroke="#ff6467" stroke-width="1.5"/><text x="290" y="236" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">⑦ 廃棄</text><text x="290" y="254" text-anchor="middle" font-size="13" fill="#818181">完全消去と記録</text></g><path d="M 650 132 V 200" fill="none" stroke="#818181" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#dp-arrow-muted)"/><line x1="570" y1="238" x2="550" y2="238" stroke="#818181" stroke-width="1.5" marker-end="url(#dp-arrow-muted)" fill="#f5f5f5"/><line x1="390" y1="238" x2="370" y2="238" stroke="#818181" stroke-width="1.5" marker-end="url(#dp-arrow-muted)" fill="#f5f5f5"/><g fill="#f5f5f5"><rect x="30" y="204" width="160" height="68" rx="14" fill="#00bc7d" fill-opacity="0.07" stroke="#00bc7d" stroke-width="1.5"/><text x="46" y="228" font-size="13" font-weight="600" fill="#f5f5f5">安全管理措置</text></g><text x="46" y="248" text-anchor="start" font-size="13" font-weight="400" fill="#818181">全段階に適用</text><text x="380" y="296" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">各段階の実施状況を記録し、説明できるようにする</text><text x="380" y="322" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">委託先には契約で同等の保護を求める</text></g></svg>
