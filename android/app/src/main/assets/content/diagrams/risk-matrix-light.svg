g><text x="206" y="46" text-anchor="middle" font-size="13" fill="#686868">1</text><text x="258" y="46" text-anchor="middle" font-size="13" fill="#686868">2</text><text x="310" y="46" text-anchor="middle" font-size="13" fill="#686868">3</text><text x="362" y="46" text-anchor="middle" font-size="13" fill="#686868">4</text><text x="414" y="46" text-anchor="middle" font-size="13" fill="#686868">5</text><text x="172" y="87" text-anchor="end" font-size="13" fill="#686868">5</text><text x="172" y="139" text-anchor="end" font-size="13" fill="#686868">4</text><text x="172" y="191" text-anchor="end" font-size="13" fill="#686868">3</text><text x="172" y="243" text-anchor="end" font-size="13" fill="#686868">2</text><text x="172" y="295" text-anchor="end" font-size="13" fill="#686868">1</text><text x="310" y="344" text-anchor="middle" font-size="13" fill="#686868">影響度（小 → 大）</text><text x="104" y="186" text-anchor="middle" font-size="13" fill="#686868" transform="rotate(-90 104 186)">発生可能性（小 → 大）</text><g fill="#262626"><rect x="474" y="64" width="262" height="64" rx="10" fill="#c10007" fill-opacity="0.1" stroke="#c10007" stroke-width="1.5"/><text x="605" y="94" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">高リスク（15〜25）</text><text x="605" y="112" text-anchor="middle" font-size="13" fill="#686868">回避・低減を優先し経営層へ報告</text></g><g fill="#262626"><rect x="474" y="146" width="262" height="64" rx="10" fill="#bb4d00" fill-opacity="0.1" stroke="#bb4d00" stroke-width="1.5"/><text x="605" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">中リスク（9〜14）</text><text x="605" y="194" text-anchor="middle" font-size="13" fill="#686868">管理策で低減し、監視を強化</text></g><g fill="#262626"><rect x="474" y="228" width="262" height="64" rx="10" fill="#007a55" fill-opacity="0.1" stroke="#007a55" stroke-width="1.5"/><text x="605" y="258" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">低リスク（1〜8）</text><text x="605" y="276" text-anchor="middle" font-size="13" fill="#686868">受容し、定期レビューを継続</text></g><text x="605" y="314" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">リスク値 = 発生可能性 × 影響度</text><text x="605" y="336" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">の目安。基準は組織ごとに設定する</text></g></svg>
