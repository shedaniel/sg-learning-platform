<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 360" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><title>事業継続タイムライン</title><desc>障害発生からBCP発動、重要業務の継続、復旧、事後レビューまでの時間軸と、RPO・RTOの目標範囲を示す図。</desc><g font-family="sans-serif" font-size="13" fill="#262626"><defs><marker id="bcp-arrow-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#262626" stroke="none"/></marker><marker id="bcp-arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#686868" stroke="none"/></marker><marker id="bcp-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009689" stroke="none"/></marker><marker id="bcp-arrow-success" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#007a55" stroke="none"/></marker><marker id="bcp-arrow-warning" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bb4d00" stroke="none"/></marker><marker id="bcp-arrow-error" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c10007" stroke="none"/></marker><marker id="bcp-arrow-c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f54a00" stroke="none"/></marker><marker id="bcp-arrow-c2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009689" stroke="none"/></marker><marker id="bcp-arrow-c3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#104e64" stroke="none"/></marker><marker id="bcp-arrow-c4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb900" stroke="none"/></marker><marker id="bcp-arrow-c5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker><marker id="bcp-arrow-c6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker></defs><text x="380" y="30" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">BCP は発動してから復旧するまでの時間と、失ってよいデータの範囲を定める</text><line x1="40" y1="116" x2="712" y2="116" stroke="#686868" stroke-width="1.5" marker-end="url(#bcp-arrow-muted)" fill="#262626"/><text x="706" y="108" text-anchor="end" font-size="13" font-weight="400" fill="#686868">時間</text><line x1="90" y1="100" x2="90" y2="122" stroke="#fe9a00" stroke-width="1.5" stroke-dasharray="4 3" fill="#262626"/><line x1="210" y1="100" x2="210" y2="122" stroke="#c10007" stroke-width="1.5" stroke-dasharray="4 3" fill="#262626"/><line x1="330" y1="100" x2="330" y2="122" stroke="#bb4d00" stroke-width="1.5" stroke-dasharray="4 3" fill="#262626"/><line x1="550" y1="100" x2="550" y2="122" stroke="#007a55" stroke-width="1.5" stroke-dasharray="4 3" fill="#262626"/><line x1="660" y1="100" x2="660" y2="122" stroke="#fe9a00" stroke-width="1.5" stroke-dasharray="4 3" fill="#262626"/><circle cx="90" cy="116" r="4" fill="#fe9a00" stroke="none"/><circle cx="210" cy="116" r="4" fill="#c10007" stroke="none"/><circle cx="330" cy="116" r="4" fill="#bb4d00" stroke="none"/><circle cx="550" cy="116" r="4" fill="#007a55" stroke="none"/><circle cx="660" cy="116" r="4" fill="#fe9a00" stroke="none"/><text x="90" y="92" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">最終バックアップ</text><text x="210" y="92" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">障害発生</text><text x="330" y="92" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">BCP 発動</text><text x="550" y="92" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">復旧完了</text><text x="660" y="92" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">レビュー</text><path d="M 90 136 V 152 M 90 144 H 210 M 210 136 V 152" fill="none" stroke="#c10007" stroke-width="1.5"/><text x="150" y="166" text-anchor="middle" font-size="13" font-weight="400" fill="#c10007">RPO：データ消失の許容範囲</text><path d="M 210 176 V 192 M 210 184 H 550 M 550 176 V 192" fill="none" stroke="#bb4d00" stroke-width="1.5"/><text x="380" y="210" text-anchor="middle" font-size="13" font-weight="400" fill="#bb4d00">RTO：サービス停止の許容範囲</text><g fill="#262626"><rect x="90" y="240" width="220" height="66" rx="10" fill="#bb4d00" fill-opacity="0.1" stroke="#bb4d00" stroke-width="1.5"/><text x="200" y="271" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">初動・BCP 発動</text><text x="200" y="289" text-anchor="middle" font-size="13" fill="#686868">体制の立上げと優先業務の選定</text></g><g fill="#262626"><rect x="330" y="240" width="220" height="66" rx="10" fill="#fe9a00" fill-opacity="0.1" stroke="#fe9a00" stroke-width="1.5"/><text x="440" y="271" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">重要業務の継続と復旧</text><text x="440" y="289" text-anchor="middle" font-size="13" fill="#686868">RTO 内の再開を目指す</text></g><g fill="#262626"><rect x="570" y="240" width="160" height="66" rx="10" fill="#fe9a00" fill-opacity="0.1" stroke="#fe9a00" stroke-width="1.5"/><text x="650" y="271" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">事後レビュー</text><text x="650" y="289" text-anchor="middle" font-size="13" fill="#686868">BCP の見直し</text></g><line x1="310" y1="273" x2="326" y2="273" stroke="#686868" stroke-width="1.5" marker-end="url(#bcp-arrow-muted)" fill="#262626"/><line x1="550" y1="273" x2="566" y2="273" stroke="#686868" stroke-width="1.5" marker-end="url(#bcp-arrow-muted)" fill="#262626"/><text x="380" y="338" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">RTO・RPO は業務影響から決め、演習で達成可能性を確認する</text></g></svg>
