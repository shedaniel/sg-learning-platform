<svg viewBox="0 0 760 360" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><title>監査プロセス</title><desc>予備調査・本調査・結論・報告・フォローアップの5段階と、各段階の成果物、次期監査への改善の循環を示す図。</desc><g font-family="sans-serif" font-size="13" fill="#f5f5f5"><defs><marker id="audit-arrow-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f5f5f5" stroke="none"/></marker><marker id="audit-arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#818181" stroke="none"/></marker><marker id="audit-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00bc7d" stroke="none"/></marker><marker id="audit-arrow-success" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00d492" stroke="none"/></marker><marker id="audit-arrow-warning" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb900" stroke="none"/></marker><marker id="audit-arrow-error" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6467" stroke="none"/></marker><marker id="audit-arrow-c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1447e6" stroke="none"/></marker><marker id="audit-arrow-c2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00bc7d" stroke="none"/></marker><marker id="audit-arrow-c3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker><marker id="audit-arrow-c4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ad46ff" stroke="none"/></marker><marker id="audit-arrow-c5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff2056" stroke="none"/></marker><marker id="audit-arrow-c6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff2056" stroke="none"/></marker></defs><text x="380" y="36" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">監査は独立した立場で証拠を集め、基準への適合を判断して改善につなげる</text><g fill="#f5f5f5"><g fill="#f5f5f5"><rect x="18" y="76" width="132" height="70" rx="10" fill="#1d1d1d" fill-opacity="0.65" stroke="#272727" stroke-width="1.5"/><text x="84" y="109" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">予備調査</text><text x="84" y="127" text-anchor="middle" font-size="13" fill="#818181">資料と体制の把握</text></g><line x1="84" y1="146" x2="84" y2="162" stroke="#272727" stroke-width="1.5" stroke-dasharray="4 3" fill="#f5f5f5"/><g fill="#f5f5f5"><rect x="18" y="166" width="132" height="32" rx="8" fill="#ff2056" fill-opacity="0.1" stroke="#ff2056" stroke-width="1.5"/><text x="84" y="187" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">監査計画</text></g><line x1="150" y1="111" x2="162" y2="111" stroke="#818181" stroke-width="1.5" marker-end="url(#audit-arrow-muted)" fill="#f5f5f5"/></g><g fill="#f5f5f5"><g fill="#f5f5f5"><rect x="166" y="76" width="132" height="70" rx="10" fill="#1d1d1d" fill-opacity="0.65" stroke="#272727" stroke-width="1.5"/><text x="232" y="109" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">本調査</text><text x="232" y="127" text-anchor="middle" font-size="13" fill="#818181">証拠の収集・検証</text></g><line x1="232" y1="146" x2="232" y2="162" stroke="#272727" stroke-width="1.5" stroke-dasharray="4 3" fill="#f5f5f5"/><g fill="#f5f5f5"><rect x="166" y="166" width="132" height="32" rx="8" fill="#ff2056" fill-opacity="0.1" stroke="#ff2056" stroke-width="1.5"/><text x="232" y="187" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">監査調書</text></g><line x1="298" y1="111" x2="310" y2="111" stroke="#818181" stroke-width="1.5" marker-end="url(#audit-arrow-muted)" fill="#f5f5f5"/></g><g fill="#f5f5f5"><g fill="#f5f5f5"><rect x="314" y="76" width="132" height="70" rx="10" fill="#1d1d1d" fill-opacity="0.65" stroke="#272727" stroke-width="1.5"/><text x="380" y="109" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">結論</text><text x="380" y="127" text-anchor="middle" font-size="13" fill="#818181">適合性の判断</text></g><line x1="380" y1="146" x2="380" y2="162" stroke="#272727" stroke-width="1.5" stroke-dasharray="4 3" fill="#f5f5f5"/><g fill="#f5f5f5"><rect x="314" y="166" width="132" height="32" rx="8" fill="#ff2056" fill-opacity="0.1" stroke="#ff2056" stroke-width="1.5"/><text x="380" y="187" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">指摘事項</text></g><line x1="446" y1="111" x2="458" y2="111" stroke="#818181" stroke-width="1.5" marker-end="url(#audit-arrow-muted)" fill="#f5f5f5"/></g><g fill="#f5f5f5"><g fill="#f5f5f5"><rect x="462" y="76" width="132" height="70" rx="10" fill="#1d1d1d" fill-opacity="0.65" stroke="#272727" stroke-width="1.5"/><text x="528" y="109" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">報告</text><text x="528" y="127" text-anchor="middle" font-size="13" fill="#818181">報告書と改善要求</text></g><line x1="528" y1="146" x2="528" y2="162" stroke="#272727" stroke-width="1.5" stroke-dasharray="4 3" fill="#f5f5f5"/><g fill="#f5f5f5"><rect x="462" y="166" width="132" height="32" rx="8" fill="#ff2056" fill-opacity="0.1" stroke="#ff2056" stroke-width="1.5"/><text x="528" y="187" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">監査報告書</text></g><line x1="594" y1="111" x2="606" y2="111" stroke="#818181" stroke-width="1.5" marker-end="url(#audit-arrow-muted)" fill="#f5f5f5"/></g><g fill="#f5f5f5"><g fill="#f5f5f5"><rect x="610" y="76" width="132" height="70" rx="10" fill="#1d1d1d" fill-opacity="0.65" stroke="#272727" stroke-width="1.5"/><text x="676" y="109" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">フォローアップ</text><text x="676" y="127" text-anchor="middle" font-size="13" fill="#818181">是正状況の確認</text></g><line x1="676" y1="146" x2="676" y2="162" stroke="#272727" stroke-width="1.5" stroke-dasharray="4 3" fill="#f5f5f5"/><g fill="#f5f5f5"><rect x="610" y="166" width="132" height="32" rx="8" fill="#ff2056" fill-opacity="0.1" stroke="#ff2056" stroke-width="1.5"/><text x="676" y="187" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">是正計画</text></g></g><path d="M 676 198 V 268 H 84 V 202" fill="none" stroke="#00bc7d" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#audit-arrow-accent)"/><text x="380" y="292" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">次期監査・継続的改善</text><text x="380" y="320" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">下段は各段階の成果物。監査結果は経営層に報告する</text></g></svg>
