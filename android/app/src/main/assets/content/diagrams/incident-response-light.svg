<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 360" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><title>インシデント対応ライフサイクル</title><desc>準備、検知・受付、トリアージ、封じ込め、根絶、復旧、教訓化の7段階と、教訓を次の準備に反映する循環を示す図。</desc><g font-family="sans-serif" font-size="13" fill="#262626"><defs><marker id="ir-arrow-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#262626" stroke="none"/></marker><marker id="ir-arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#686868" stroke="none"/></marker><marker id="ir-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009689" stroke="none"/></marker><marker id="ir-arrow-success" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#007a55" stroke="none"/></marker><marker id="ir-arrow-warning" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bb4d00" stroke="none"/></marker><marker id="ir-arrow-error" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c10007" stroke="none"/></marker><marker id="ir-arrow-c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f54a00" stroke="none"/></marker><marker id="ir-arrow-c2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009689" stroke="none"/></marker><marker id="ir-arrow-c3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#104e64" stroke="none"/></marker><marker id="ir-arrow-c4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb900" stroke="none"/></marker><marker id="ir-arrow-c5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker><marker id="ir-arrow-c6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker></defs><text x="380" y="36" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">準備を起点に、検知から教訓化までを一巡し、次の備えに反映する</text><g fill="#262626"><rect x="22" y="64" width="164" height="64" rx="10" fill="#009689" fill-opacity="0.1" stroke="#009689" stroke-width="1.5"/><text x="104" y="94" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">① 準備</text><text x="104" y="112" text-anchor="middle" font-size="13" fill="#686868">体制・連絡網・演習</text></g><g fill="#262626"><rect x="206" y="64" width="164" height="64" rx="10" fill="#fe9a00" fill-opacity="0.1" stroke="#fe9a00" stroke-width="1.5"/><text x="288" y="94" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">② 検知・受付</text><text x="288" y="112" text-anchor="middle" font-size="13" fill="#686868">監視と通報の受付</text></g><g fill="#262626"><rect x="390" y="64" width="164" height="64" rx="10" fill="#009689" fill-opacity="0.1" stroke="#009689" stroke-width="1.5"/><text x="472" y="94" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">③ トリアージ</text><text x="472" y="112" text-anchor="middle" font-size="13" fill="#686868">影響度・優先度の判断</text></g><g fill="#262626"><rect x="574" y="64" width="164" height="64" rx="10" fill="#bb4d00" fill-opacity="0.1" stroke="#bb4d00" stroke-width="1.5"/><text x="656" y="94" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">④ 封じ込め</text><text x="656" y="112" text-anchor="middle" font-size="13" fill="#686868">被害拡大を阻止</text></g><g fill="#262626"><rect x="574" y="212" width="164" height="64" rx="10" fill="#fe9a00" fill-opacity="0.1" stroke="#fe9a00" stroke-width="1.5"/><text x="656" y="242" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">⑤ 根絶</text><text x="656" y="260" text-anchor="middle" font-size="13" fill="#686868">原因を除去</text></g><g fill="#262626"><rect x="390" y="212" width="164" height="64" rx="10" fill="#007a55" fill-opacity="0.1" stroke="#007a55" stroke-width="1.5"/><text x="472" y="242" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">⑥ 復旧</text><text x="472" y="260" text-anchor="middle" font-size="13" fill="#686868">サービス再開</text></g><g fill="#262626"><rect x="206" y="212" width="164" height="64" rx="10" fill="#f54a00" fill-opacity="0.1" stroke="#f54a00" stroke-width="1.5"/><text x="288" y="242" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">⑦ 教訓化</text><text x="288" y="260" text-anchor="middle" font-size="13" fill="#686868">再発防止と改善</text></g><line x1="186" y1="96" x2="202" y2="96" stroke="#686868" stroke-width="1.5" marker-end="url(#ir-arrow-muted)" fill="#262626"/><line x1="370" y1="96" x2="386" y2="96" stroke="#686868" stroke-width="1.5" marker-end="url(#ir-arrow-muted)" fill="#262626"/><line x1="554" y1="96" x2="570" y2="96" stroke="#686868" stroke-width="1.5" marker-end="url(#ir-arrow-muted)" fill="#262626"/><line x1="656" y1="128" x2="656" y2="208" stroke="#bb4d00" stroke-width="1.5" marker-end="url(#ir-arrow-warning)" fill="#262626"/><line x1="574" y1="244" x2="554" y2="244" stroke="#686868" stroke-width="1.5" marker-end="url(#ir-arrow-muted)" fill="#262626"/><line x1="390" y1="244" x2="370" y2="244" stroke="#686868" stroke-width="1.5" marker-end="url(#ir-arrow-muted)" fill="#262626"/><path d="M 206 244 H 96 V 132" fill="none" stroke="#009689" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ir-arrow-accent)"/><text x="380" y="320" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">教訓を準備・計画に反映し、次のインシデントに備える</text><text x="380" y="344" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">初動の遅れが被害を大きくする</text></g></svg>
