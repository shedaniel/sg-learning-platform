<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 400" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><title>TLS ハンドシェイク</title><desc>クライアントとサーバが ClientHello、ServerHello と証明書、証明書検証、鍵交換、Finished を経て暗号化通信を始める流れを示す図。</desc><g font-family="sans-serif" font-size="13" fill="#262626"><defs><marker id="tls-arrow-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#262626" stroke="none"/></marker><marker id="tls-arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#686868" stroke="none"/></marker><marker id="tls-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009689" stroke="none"/></marker><marker id="tls-arrow-success" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#007a55" stroke="none"/></marker><marker id="tls-arrow-warning" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bb4d00" stroke="none"/></marker><marker id="tls-arrow-error" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c10007" stroke="none"/></marker><marker id="tls-arrow-c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f54a00" stroke="none"/></marker><marker id="tls-arrow-c2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009689" stroke="none"/></marker><marker id="tls-arrow-c3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#104e64" stroke="none"/></marker><marker id="tls-arrow-c4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb900" stroke="none"/></marker><marker id="tls-arrow-c5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker><marker id="tls-arrow-c6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker></defs><text x="380" y="18" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">TLS ハンドシェイク（簡略）：相手を確認し、共通鍵を共有する</text><g fill="#262626"><rect x="40" y="32" width="160" height="44" rx="10" fill="#fe9a00" fill-opacity="0.1" stroke="#fe9a00" stroke-width="1.5"/><text x="120" y="59" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">クライアント</text></g><g fill="#262626"><rect x="560" y="32" width="160" height="44" rx="10" fill="#f54a00" fill-opacity="0.1" stroke="#f54a00" stroke-width="1.5"/><text x="640" y="59" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">サーバ</text></g><line x1="120" y1="80" x2="120" y2="384" stroke="#e5e5e5" stroke-width="1.5" stroke-dasharray="5 5" fill="#262626"/><line x1="640" y1="80" x2="640" y2="384" stroke="#e5e5e5" stroke-width="1.5" stroke-dasharray="5 5" fill="#262626"/><text x="380" y="106" text-anchor="middle" font-size="13" font-weight="400" fill="#262626">① ClientHello：対応バージョン・暗号スイート・乱数</text><line x1="124" y1="116" x2="632" y2="116" stroke="#009689" stroke-width="1.5" marker-end="url(#tls-arrow-accent)" fill="#262626"/><text x="380" y="156" text-anchor="middle" font-size="13" font-weight="400" fill="#262626">② ServerHello・サーバ証明書（公開鍵）</text><line x1="636" y1="166" x2="128" y2="166" stroke="#686868" stroke-width="1.5" marker-end="url(#tls-arrow-muted)" fill="#262626"/><g fill="#262626"><rect x="136" y="186" width="270" height="58" rx="10" fill="#bb4d00" fill-opacity="0.1" stroke="#bb4d00" stroke-width="1.5"/><text x="271" y="213" text-anchor="middle" font-size="13" font-weight="600" fill="#262626">③ 証明書を検証</text><text x="271" y="231" text-anchor="middle" font-size="13" fill="#686868">連鎖・有効期限・失効を確認</text></g><text x="380" y="276" text-anchor="middle" font-size="13" font-weight="400" fill="#262626">④ 鍵交換（ECDHE）：共有鍵の材料を交換</text><line x1="124" y1="286" x2="632" y2="286" stroke="#009689" stroke-width="1.5" marker-end="url(#tls-arrow-accent)" fill="#262626"/><text x="380" y="326" text-anchor="middle" font-size="13" font-weight="400" fill="#262626">⑤ Finished：ハンドシェイクの完全性を検証</text><line x1="124" y1="336" x2="632" y2="336" stroke="#686868" stroke-width="1.5" marker-end="url(#tls-arrow-muted)" fill="#262626"/><text x="380" y="368" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">⑥ 暗号化通信（共通鍵暗号 AES-GCM など）</text><line x1="124" y1="378" x2="632" y2="378" stroke="#007a55" stroke-width="1.5" marker-end="url(#tls-arrow-success)" marker-start="url(#tls-arrow-success)" fill="#262626"/></g></svg>
