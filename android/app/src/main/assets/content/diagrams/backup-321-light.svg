<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 360" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><title>3-2-1 バックアップ</title><desc>3部のコピーを2種類の媒体に保存し、1部を遠隔地に置く3-2-1ルールと、イミュータブル保管の考え方を示す図。</desc><g font-family="sans-serif" font-size="13" fill="#262626"><defs><marker id="b321-arrow-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#262626" stroke="none"/></marker><marker id="b321-arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#686868" stroke="none"/></marker><marker id="b321-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009689" stroke="none"/></marker><marker id="b321-arrow-success" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#007a55" stroke="none"/></marker><marker id="b321-arrow-warning" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bb4d00" stroke="none"/></marker><marker id="b321-arrow-error" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c10007" stroke="none"/></marker><marker id="b321-arrow-c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f54a00" stroke="none"/></marker><marker id="b321-arrow-c2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009689" stroke="none"/></marker><marker id="b321-arrow-c3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#104e64" stroke="none"/></marker><marker id="b321-arrow-c4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb900" stroke="none"/></marker><marker id="b321-arrow-c5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker><marker id="b321-arrow-c6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker></defs><text x="380" y="32" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">3-2-1 ルール：3 部のコピーを 2 種類の媒体に分け、1 部を遠隔地に置く</text><g fill="#262626"><rect x="40" y="54" width="220" height="84" rx="12" fill="#f5f5f5" fill-opacity="0.65" stroke="#ebebeb" stroke-width="1.5"/><text x="74" y="102" text-anchor="middle" font-size="28" font-weight="700" fill="#009689">3</text><text x="102" y="86" font-size="15" font-weight="600" fill="#262626">3 部のコピー</text><text x="102" y="110" font-size="13" fill="#686868">原本 + 予備 2 部</text></g><g fill="#262626"><rect x="270" y="54" width="220" height="84" rx="12" fill="#f5f5f5" fill-opacity="0.65" stroke="#ebebeb" stroke-width="1.5"/><text x="304" y="102" text-anchor="middle" font-size="28" font-weight="700" fill="#009689">2</text><text x="332" y="86" font-size="15" font-weight="600" fill="#262626">2 種類の媒体</text><text x="332" y="110" font-size="13" fill="#686868">HDD・クラウド等</text></g><g fill="#262626"><rect x="500" y="54" width="220" height="84" rx="12" fill="#f5f5f5" fill-opacity="0.65" stroke="#ebebeb" stroke-width="1.5"/><text x="534" y="102" text-anchor="middle" font-size="28" font-weight="700" fill="#009689">1</text><text x="562" y="86" font-size="15" font-weight="600" fill="#262626">1 か所は遠隔地</text><text x="562" y="110" font-size="13" fill="#686868">物理的に離れた場所</text></g><g fill="#262626"><rect x="60" y="200" width="150" height="64" rx="10" fill="#fe9a00" fill-opacity="0.1" stroke="#fe9a00" stroke-width="1.5"/><text x="135" y="230" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">原本</text><text x="135" y="248" text-anchor="middle" font-size="13" fill="#686868">本番データ</text></g><g fill="#262626"><rect x="320" y="154" width="200" height="58" rx="10" fill="#fe9a00" fill-opacity="0.1" stroke="#fe9a00" stroke-width="1.5"/><text x="420" y="181" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">バックアップ①</text><text x="420" y="199" text-anchor="middle" font-size="13" fill="#686868">媒体 A・社内</text></g><g fill="#262626"><rect x="320" y="250" width="200" height="58" rx="10" fill="#f54a00" fill-opacity="0.1" stroke="#f54a00" stroke-width="1.5"/><text x="420" y="277" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">バックアップ②</text><text x="420" y="295" text-anchor="middle" font-size="13" fill="#686868">媒体 B・遠隔地</text></g><path d="M 210 224 H 265 V 183 H 316" fill="none" stroke="#686868" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#b321-arrow-muted)"/><path d="M 210 240 H 265 V 279 H 316" fill="none" stroke="#686868" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#b321-arrow-muted)"/><g fill="#262626"><rect x="548" y="150" width="188" height="164" rx="14" fill="#009689" fill-opacity="0.07" stroke="#009689" stroke-width="1.5"/><text x="564" y="174" font-size="13" font-weight="600" fill="#262626">イミュータブル保管</text></g><text x="564" y="206" text-anchor="start" font-size="13" font-weight="400" fill="#686868">一定期間の削除を禁止</text><text x="564" y="234" text-anchor="start" font-size="13" font-weight="400" fill="#686868">改ざん・暗号化を防ぐ</text><text x="564" y="262" text-anchor="start" font-size="13" font-weight="400" fill="#686868">世代管理で復旧点確保</text><text x="564" y="290" text-anchor="start" font-size="13" font-weight="400" fill="#686868">リストア演習も行う</text><line x1="520" y1="279" x2="544" y2="279" stroke="#009689" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#b321-arrow-c2)" fill="#262626"/><text x="380" y="338" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">3-2-1 を満たしても、定期的なリストア演習で復元できることを確認する</text></g></svg>
