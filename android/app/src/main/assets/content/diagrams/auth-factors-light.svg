<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 360" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><title>認証の3要素と多要素認証</title><desc>記憶・所有・生体の3つの認証要素と、異なる要素を組み合わせる多要素認証、同じ要素を重ねてもMFAにならない例を示す図。</desc><g font-family="sans-serif" font-size="13" fill="#262626"><defs><marker id="auth-arrow-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#262626" stroke="none"/></marker><marker id="auth-arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#686868" stroke="none"/></marker><marker id="auth-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009689" stroke="none"/></marker><marker id="auth-arrow-success" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#007a55" stroke="none"/></marker><marker id="auth-arrow-warning" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bb4d00" stroke="none"/></marker><marker id="auth-arrow-error" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c10007" stroke="none"/></marker><marker id="auth-arrow-c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f54a00" stroke="none"/></marker><marker id="auth-arrow-c2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009689" stroke="none"/></marker><marker id="auth-arrow-c3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#104e64" stroke="none"/></marker><marker id="auth-arrow-c4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb900" stroke="none"/></marker><marker id="auth-arrow-c5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker><marker id="auth-arrow-c6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker></defs><text x="380" y="32" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">認証の 3 要素は知識・所持・生体。異なる要素を 2 つ以上組み合わせる</text><g fill="#262626"><rect x="40" y="58" width="210" height="88" rx="10" fill="#fe9a00" fill-opacity="0.1" stroke="#fe9a00" stroke-width="1.5"/><text x="145" y="90" text-anchor="middle" font-size="15" font-weight="600" fill="#262626">記憶（知識）</text><text x="145" y="110" text-anchor="middle" font-size="13" fill="#686868">パスワード・PIN</text><text x="145" y="128" text-anchor="middle" font-size="13" fill="#686868">忘れる・使い回し</text></g><g fill="#262626"><rect x="275" y="58" width="210" height="88" rx="10" fill="#104e64" fill-opacity="0.1" stroke="#104e64" stroke-width="1.5"/><text x="380" y="90" text-anchor="middle" font-size="15" font-weight="600" fill="#262626">所有（所持）</text><text x="380" y="110" text-anchor="middle" font-size="13" fill="#686868">IC カード・スマホ</text><text x="380" y="128" text-anchor="middle" font-size="13" fill="#686868">紛失・盗難の危険</text></g><g fill="#262626"><rect x="510" y="58" width="210" height="88" rx="10" fill="#f54a00" fill-opacity="0.1" stroke="#f54a00" stroke-width="1.5"/><text x="615" y="90" text-anchor="middle" font-size="15" font-weight="600" fill="#262626">生体（特性）</text><text x="615" y="110" text-anchor="middle" font-size="13" fill="#686868">指紋・顔・静脈</text><text x="615" y="128" text-anchor="middle" font-size="13" fill="#686868">変更不可・誤認識</text></g><g fill="#262626"><rect x="40" y="170" width="680" height="150" rx="14" fill="#009689" fill-opacity="0.07" stroke="#009689" stroke-width="1.5"/><text x="56" y="194" font-size="14" font-weight="600" fill="#262626">多要素認証（MFA）：異なる要素を組み合わせる</text></g><g fill="#262626"><rect x="60" y="210" width="200" height="88" rx="10" fill="#007a55" fill-opacity="0.1" stroke="#007a55" stroke-width="1.5"/><text x="160" y="242" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">知識 + 所持</text><text x="160" y="262" text-anchor="middle" font-size="13" fill="#686868">パスワード + スマホ</text><text x="160" y="280" text-anchor="middle" font-size="13" fill="#007a55">○ MFA として有効</text></g><g fill="#262626"><rect x="280" y="210" width="200" height="88" rx="10" fill="#007a55" fill-opacity="0.1" stroke="#007a55" stroke-width="1.5"/><text x="380" y="242" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">知識 + 生体</text><text x="380" y="262" text-anchor="middle" font-size="13" fill="#686868">パスワード + 指紋</text><text x="380" y="280" text-anchor="middle" font-size="13" fill="#007a55">○ MFA として有効</text></g><g fill="#262626"><rect x="500" y="210" width="200" height="88" rx="10" fill="#c10007" fill-opacity="0.1" stroke="#c10007" stroke-width="1.5"/><text x="600" y="242" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">知識 + 知識</text><text x="600" y="262" text-anchor="middle" font-size="13" fill="#686868">パスワード + 秘密の質問</text><text x="600" y="280" text-anchor="middle" font-size="13" fill="#c10007">× 同一要素で MFA でない</text></g><text x="380" y="342" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">パスワードレス認証は所持と生体を組み合わせて実現する</text></g></svg>
