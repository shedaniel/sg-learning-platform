<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 400" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><title>TLS ハンドシェイク</title><desc>クライアントとサーバが ClientHello、ServerHello と証明書、証明書検証、鍵交換、Finished を経て暗号化通信を始める流れを示す図。</desc><g font-family="sans-serif" font-size="13" fill="#f5f5f5"><defs><marker id="tls-arrow-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f5f5f5" stroke="none"/></marker><marker id="tls-arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#818181" stroke="none"/></marker><marker id="tls-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00bc7d" stroke="none"/></marker><marker id="tls-arrow-success" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00d492" stroke="none"/></marker><marker id="tls-arrow-warning" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb900" stroke="none"/></marker><marker id="tls-arrow-error" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6467" stroke="none"/></marker><marker id="tls-arrow-c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1447e6" stroke="none"/></marker><marker id="tls-arrow-c2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00bc7d" stroke="none"/></marker><marker id="tls-arrow-c3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker><marker id="tls-arrow-c4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ad46ff" stroke="none"/></marker><marker id="tls-arrow-c5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff2056" stroke="none"/></marker><marker id="tls-arrow-c6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff2056" stroke="none"/></marker></defs><text x="380" y="18" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">TLS ハンドシェイク（簡略）：相手を確認し、共通鍵を共有する</text><g fill="#f5f5f5"><rect x="40" y="32" width="160" height="44" rx="10" fill="#ff2056" fill-opacity="0.1" stroke="#ff2056" stroke-width="1.5"/><text x="120" y="59" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">クライアント</text></g><g fill="#f5f5f5"><rect x="560" y="32" width="160" height="44" rx="10" fill="#1447e6" fill-opacity="0.1" stroke="#1447e6" stroke-width="1.5"/><text x="640" y="59" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">サーバ</text></g><line x1="120" y1="80" x2="120" y2="384" stroke="#272727" stroke-width="1.5" stroke-dasharray="5 5" fill="#f5f5f5"/><line x1="640" y1="80" x2="640" y2="384" stroke="#272727" stroke-width="1.5" stroke-dasharray="5 5" fill="#f5f5f5"/><text x="380" y="106" text-anchor="middle" font-size="13" font-weight="400" fill="#f5f5f5">① ClientHello：対応バージョン・暗号スイート・乱数</text><line x1="124" y1="116" x2="632" y2="116" stroke="#00bc7d" stroke-width="1.5" marker-end="url(#tls-arrow-accent)" fill="#f5f5f5"/><text x="380" y="156" text-anchor="middle" font-size="13" font-weight="400" fill="#f5f5f5">② ServerHello・サーバ証明書（公開鍵）</text><line x1="636" y1="166" x2="128" y2="166" stroke="#818181" stroke-width="1.5" marker-end="url(#tls-arrow-muted)" fill="#f5f5f5"/><g fill="#f5f5f5"><rect x="136" y="186" width="270" height="58" rx="10" fill="#ffb900" fill-opacity="0.1" stroke="#ffb900" stroke-width="1.5"/><text x="271" y="213" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">③ 証明書を検証</text><text x="271" y="231" text-anchor="middle" font-size="13" fill="#818181">連鎖・有効期限・失効を確認</text></g><text x="380" y="276" text-anchor="middle" font-size="13" font-weight="400" fill="#f5f5f5">④ 鍵交換（ECDHE）：共有鍵の材料を交換</text><line x1="124" y1="286" x2="632" y2="286" stroke="#00bc7d" stroke-width="1.5" marker-end="url(#tls-arrow-accent)" fill="#f5f5f5"/><text x="380" y="326" text-anchor="middle" font-size="13" font-weight="400" fill="#f5f5f5">⑤ Finished：ハンドシェイクの完全性を検証</text><line x1="124" y1="336" x2="632" y2="336" stroke="#818181" stroke-width="1.5" marker-end="url(#tls-arrow-muted)" fill="#f5f5f5"/><text x="380" y="368" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">⑥ 暗号化通信（共通鍵暗号 AES-GCM など）</text><line x1="124" y1="378" x2="632" y2="378" stroke="#00d492" stroke-width="1.5" marker-end="url(#tls-arrow-success)" marker-start="url(#tls-arrow-success)" fill="#f5f5f5"/></g></svg>
