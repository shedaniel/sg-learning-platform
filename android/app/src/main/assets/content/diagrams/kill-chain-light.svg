<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 360" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><title>サイバーキルチェーン</title><desc>偵察から目的遂行までの7段階の攻撃手順と、各段階で攻撃を遮断する多層防御の考え方を示す図。</desc><g font-family="sans-serif" font-size="13" fill="#262626"><defs><marker id="kc-arrow-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#262626" stroke="none"/></marker><marker id="kc-arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#686868" stroke="none"/></marker><marker id="kc-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009689" stroke="none"/></marker><marker id="kc-arrow-success" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#007a55" stroke="none"/></marker><marker id="kc-arrow-warning" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bb4d00" stroke="none"/></marker><marker id="kc-arrow-error" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c10007" stroke="none"/></marker><marker id="kc-arrow-c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f54a00" stroke="none"/></marker><marker id="kc-arrow-c2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009689" stroke="none"/></marker><marker id="kc-arrow-c3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#104e64" stroke="none"/></marker><marker id="kc-arrow-c4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb900" stroke="none"/></marker><marker id="kc-arrow-c5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker><marker id="kc-arrow-c6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker></defs><text x="380" y="36" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">攻撃は 7 段階で進む。防御側は各段階で遮断し、次の段階へ進ませない</text><g fill="#262626"><rect x="22" y="66" width="164" height="64" rx="10" fill="#fe9a00" fill-opacity="0.1" stroke="#fe9a00" stroke-width="1.5"/><text x="104" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">① 偵察</text><text x="104" y="114" text-anchor="middle" font-size="13" fill="#686868">公開情報・走査</text></g><g fill="#262626"><rect x="206" y="66" width="164" height="64" rx="10" fill="#fe9a00" fill-opacity="0.1" stroke="#fe9a00" stroke-width="1.5"/><text x="288" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">② 武器化</text><text x="288" y="114" text-anchor="middle" font-size="13" fill="#686868">攻撃コード作成</text></g><g fill="#262626"><rect x="390" y="66" width="164" height="64" rx="10" fill="#009689" fill-opacity="0.1" stroke="#009689" stroke-width="1.5"/><text x="472" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">③ 配送</text><text x="472" y="114" text-anchor="middle" font-size="13" fill="#686868">メール・不正サイト</text></g><g fill="#262626"><rect x="574" y="66" width="164" height="64" rx="10" fill="#bb4d00" fill-opacity="0.1" stroke="#bb4d00" stroke-width="1.5"/><text x="656" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">④ 実行</text><text x="656" y="114" text-anchor="middle" font-size="13" fill="#686868">脆弱性を悪用</text></g><g fill="#262626"><rect x="574" y="214" width="164" height="64" rx="10" fill="#fe9a00" fill-opacity="0.1" stroke="#fe9a00" stroke-width="1.5"/><text x="656" y="244" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">⑤ 導入</text><text x="656" y="262" text-anchor="middle" font-size="13" fill="#686868">マルウェア常駐</text></g><g fill="#262626"><rect x="390" y="214" width="164" height="64" rx="10" fill="#c10007" fill-opacity="0.1" stroke="#c10007" stroke-width="1.5"/><text x="472" y="244" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">⑥ C2</text><text x="472" y="262" text-anchor="middle" font-size="13" fill="#686868">外部と遠隔通信</text></g><g fill="#262626"><rect x="206" y="214" width="164" height="64" rx="10" fill="#ffb900" fill-opacity="0.1" stroke="#ffb900" stroke-width="1.5"/><text x="288" y="244" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">⑦ 目的遂行</text><text x="288" y="262" text-anchor="middle" font-size="13" fill="#686868">情報窃取・暗号化</text></g><g fill="#262626"><rect x="22" y="214" width="164" height="64" rx="10" fill="#c10007" fill-opacity="0.1" stroke="#c10007" stroke-width="1.5" stroke-dasharray="5 4"/><text x="104" y="244" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">被害発生</text><text x="104" y="262" text-anchor="middle" font-size="13" fill="#686868">漏えい・停止</text></g><line x1="186" y1="98" x2="202" y2="98" stroke="#686868" stroke-width="1.5" marker-end="url(#kc-arrow-muted)" fill="#262626"/><line x1="370" y1="98" x2="386" y2="98" stroke="#686868" stroke-width="1.5" marker-end="url(#kc-arrow-muted)" fill="#262626"/><line x1="554" y1="98" x2="570" y2="98" stroke="#686868" stroke-width="1.5" marker-end="url(#kc-arrow-muted)" fill="#262626"/><line x1="656" y1="130" x2="656" y2="210" stroke="#c10007" stroke-width="1.5" marker-end="url(#kc-arrow-error)" fill="#262626"/><text x="380" y="204" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">攻撃は番号順に進む</text><line x1="574" y1="246" x2="554" y2="246" stroke="#c10007" stroke-width="1.5" marker-end="url(#kc-arrow-error)" fill="#262626"/><line x1="390" y1="246" x2="370" y2="246" stroke="#c10007" stroke-width="1.5" marker-end="url(#kc-arrow-error)" fill="#262626"/><line x1="206" y1="246" x2="186" y2="246" stroke="#c10007" stroke-width="1.5" marker-end="url(#kc-arrow-error)" fill="#262626"/><text x="380" y="320" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">1 段階でも止めれば攻撃は完了しない（多層防御）</text></g></svg>
