<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 360" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><title>ネットワーク経路</title><desc>クライアントからインターネット、ファイアウォール、DMZ の Web サーバ、2 台目のファイアウォールを経て内部の DB サーバに届く経路とポートを示す図。</desc><g font-family="sans-serif" font-size="13" fill="#f5f5f5"><defs><marker id="net-arrow-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f5f5f5" stroke="none"/></marker><marker id="net-arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#818181" stroke="none"/></marker><marker id="net-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00bc7d" stroke="none"/></marker><marker id="net-arrow-success" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00d492" stroke="none"/></marker><marker id="net-arrow-warning" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb900" stroke="none"/></marker><marker id="net-arrow-error" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6467" stroke="none"/></marker><marker id="net-arrow-c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1447e6" stroke="none"/></marker><marker id="net-arrow-c2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00bc7d" stroke="none"/></marker><marker id="net-arrow-c3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker><marker id="net-arrow-c4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ad46ff" stroke="none"/></marker><marker id="net-arrow-c5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff2056" stroke="none"/></marker><marker id="net-arrow-c6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff2056" stroke="none"/></marker></defs><text x="380" y="40" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">クライアントから内部サーバまで、通信は複数の FW と DMZ を通過する</text><g fill="#f5f5f5"><rect x="20" y="112" width="100" height="72" rx="10" fill="#1d1d1d" fill-opacity="0.65" stroke="#272727" stroke-width="1.5"/><text x="70" y="146" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">クライアント</text><text x="70" y="164" text-anchor="middle" font-size="13" fill="#818181">ブラウザ</text></g><g fill="#f5f5f5"><rect x="144" y="112" width="100" height="72" rx="10" fill="#1d1d1d" fill-opacity="0.65" stroke="#272727" stroke-width="1.5"/><text x="194" y="146" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">インターネット</text><text x="194" y="164" text-anchor="middle" font-size="13" fill="#818181">不特定多数</text></g><g fill="#f5f5f5"><rect x="268" y="112" width="100" height="72" rx="10" fill="#00bc7d" fill-opacity="0.1" stroke="#00bc7d" stroke-width="1.5"/><text x="318" y="146" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">FW①</text><text x="318" y="164" text-anchor="middle" font-size="13" fill="#818181">公開用</text></g><g fill="#f5f5f5"><rect x="392" y="112" width="100" height="72" rx="10" fill="#ff2056" fill-opacity="0.1" stroke="#ff2056" stroke-width="1.5"/><text x="442" y="146" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">Web サーバ</text><text x="442" y="164" text-anchor="middle" font-size="13" fill="#818181">DMZ</text></g><g fill="#f5f5f5"><rect x="516" y="112" width="100" height="72" rx="10" fill="#00bc7d" fill-opacity="0.1" stroke="#00bc7d" stroke-width="1.5"/><text x="566" y="146" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">FW②</text><text x="566" y="164" text-anchor="middle" font-size="13" fill="#818181">内部用</text></g><g fill="#f5f5f5"><rect x="640" y="112" width="100" height="72" rx="10" fill="#1447e6" fill-opacity="0.1" stroke="#1447e6" stroke-width="1.5"/><text x="690" y="146" text-anchor="middle" font-size="13" font-weight="600" fill="#f5f5f5">DB サーバ</text><text x="690" y="164" text-anchor="middle" font-size="13" fill="#818181">社内 LAN</text></g><text x="132" y="96" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">HTTPS 443</text><text x="256" y="96" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">443</text><text x="380" y="96" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">443 を許可</text><text x="504" y="96" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">DB 接続</text><text x="628" y="96" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">5432 のみ</text><line x1="120" y1="148" x2="140" y2="148" stroke="#818181" stroke-width="1.5" marker-end="url(#net-arrow-muted)" fill="#f5f5f5"/><line x1="244" y1="148" x2="264" y2="148" stroke="#818181" stroke-width="1.5" marker-end="url(#net-arrow-muted)" fill="#f5f5f5"/><line x1="368" y1="148" x2="388" y2="148" stroke="#818181" stroke-width="1.5" marker-end="url(#net-arrow-muted)" fill="#f5f5f5"/><line x1="492" y1="148" x2="512" y2="148" stroke="#818181" stroke-width="1.5" marker-end="url(#net-arrow-muted)" fill="#f5f5f5"/><line x1="616" y1="148" x2="636" y2="148" stroke="#818181" stroke-width="1.5" marker-end="url(#net-arrow-muted)" fill="#f5f5f5"/><g fill="#f5f5f5"><rect x="20" y="220" width="356" height="100" rx="14" fill="#1d1d1d" fill-opacity="0.55" stroke="#222222" stroke-width="1.5"/><text x="36" y="244" font-size="14" font-weight="600" fill="#f5f5f5">経路の要点</text></g><text x="36" y="270" text-anchor="start" font-size="13" font-weight="400" fill="#818181">① 公開サーバは DMZ に置く</text><text x="36" y="292" text-anchor="start" font-size="13" font-weight="400" fill="#818181">② FW は必要なポートだけ許可する</text><text x="36" y="314" text-anchor="start" font-size="13" font-weight="400" fill="#818181">③ 内部サーバは多段で保護する</text><g fill="#f5f5f5"><rect x="392" y="220" width="348" height="100" rx="14" fill="#1d1d1d" fill-opacity="0.55" stroke="#222222" stroke-width="1.5"/><text x="408" y="244" font-size="14" font-weight="600" fill="#f5f5f5">通信の検査</text></g><text x="408" y="270" text-anchor="start" font-size="13" font-weight="400" fill="#818181">確立済みの戻り通信だけを通す</text><text x="408" y="292" text-anchor="start" font-size="13" font-weight="400" fill="#818181">拒否した通信はログに記録する</text><text x="408" y="314" text-anchor="start" font-size="13" font-weight="400" fill="#818181">許可リスト方式で最小限にする</text><text x="380" y="342" text-anchor="middle" font-size="13" font-weight="400" fill="#818181">経路上のどこで遮断できるかを設計することが重要</text></g></svg>
