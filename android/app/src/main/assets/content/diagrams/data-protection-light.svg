<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 360" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><title>データ保護ライフサイクル</title><desc>個人データの収集・分類・保存・利用・共有・保持・廃棄の各段階と、全段階に適用する安全管理措置を示す図。</desc><g font-family="sans-serif" font-size="13" fill="#262626"><defs><marker id="dp-arrow-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#262626" stroke="none"/></marker><marker id="dp-arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#686868" stroke="none"/></marker><marker id="dp-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009689" stroke="none"/></marker><marker id="dp-arrow-success" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#007a55" stroke="none"/></marker><marker id="dp-arrow-warning" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bb4d00" stroke="none"/></marker><marker id="dp-arrow-error" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c10007" stroke="none"/></marker><marker id="dp-arrow-c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f54a00" stroke="none"/></marker><marker id="dp-arrow-c2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009689" stroke="none"/></marker><marker id="dp-arrow-c3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#104e64" stroke="none"/></marker><marker id="dp-arrow-c4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb900" stroke="none"/></marker><marker id="dp-arrow-c5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker><marker id="dp-arrow-c6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker></defs><text x="380" y="30" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">個人データは収集から廃棄までのライフサイクル全体で保護する</text><g fill="#262626"><rect x="30" y="64" width="160" height="68" rx="10" fill="#fe9a00" fill-opacity="0.1" stroke="#fe9a00" stroke-width="1.5"/><text x="110" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">① 収集</text><text x="110" y="114" text-anchor="middle" font-size="13" fill="#686868">目的の特定・最小化</text></g><g fill="#262626"><rect x="210" y="64" width="160" height="68" rx="10" fill="#104e64" fill-opacity="0.1" stroke="#104e64" stroke-width="1.5"/><text x="290" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">② 分類</text><text x="290" y="114" text-anchor="middle" font-size="13" fill="#686868">機密度の設定</text></g><g fill="#262626"><rect x="390" y="64" width="160" height="68" rx="10" fill="#f54a00" fill-opacity="0.1" stroke="#f54a00" stroke-width="1.5"/><text x="470" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">③ 保存</text><text x="470" y="114" text-anchor="middle" font-size="13" fill="#686868">暗号化・権限制御</text></g><g fill="#262626"><rect x="570" y="64" width="160" height="68" rx="10" fill="#009689" fill-opacity="0.1" stroke="#009689" stroke-width="1.5"/><text x="650" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">④ 利用</text><text x="650" y="114" text-anchor="middle" font-size="13" fill="#686868">目的内での利用</text></g><line x1="190" y1="98" x2="206" y2="98" stroke="#686868" stroke-width="1.5" marker-end="url(#dp-arrow-muted)" fill="#262626"/><line x1="370" y1="98" x2="386" y2="98" stroke="#686868" stroke-width="1.5" marker-end="url(#dp-arrow-muted)" fill="#262626"/><line x1="550" y1="98" x2="566" y2="98" stroke="#686868" stroke-width="1.5" marker-end="url(#dp-arrow-muted)" fill="#262626"/><g fill="#262626"><rect x="570" y="204" width="160" height="68" rx="10" fill="#fe9a00" fill-opacity="0.1" stroke="#fe9a00" stroke-width="1.5"/><text x="650" y="236" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">⑤ 共有</text><text x="650" y="254" text-anchor="middle" font-size="13" fill="#686868">契約・同意の確認</text></g><g fill="#262626"><rect x="390" y="204" width="160" height="68" rx="10" fill="#ffb900" fill-opacity="0.1" stroke="#ffb900" stroke-width="1.5"/><text x="470" y="236" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">⑥ 保持</text><text x="470" y="254" text-anchor="middle" font-size="13" fill="#686868">保存期間の設定</text></g><g fill="#262626"><rect x="210" y="204" width="160" height="68" rx="10" fill="#c10007" fill-opacity="0.1" stroke="#c10007" stroke-width="1.5"/><text x="290" y="236" text-anchor="middle" font-size="14" font-weight="600" fill="#262626">⑦ 廃棄</text><text x="290" y="254" text-anchor="middle" font-size="13" fill="#686868">完全消去と記録</text></g><path d="M 650 132 V 200" fill="none" stroke="#686868" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#dp-arrow-muted)"/><line x1="570" y1="238" x2="550" y2="238" stroke="#686868" stroke-width="1.5" marker-end="url(#dp-arrow-muted)" fill="#262626"/><line x1="390" y1="238" x2="370" y2="238" stroke="#686868" stroke-width="1.5" marker-end="url(#dp-arrow-muted)" fill="#262626"/><g fill="#262626"><rect x="30" y="204" width="160" height="68" rx="14" fill="#009689" fill-opacity="0.07" stroke="#009689" stroke-width="1.5"/><text x="46" y="228" font-size="13" font-weight="600" fill="#262626">安全管理措置</text></g><text x="46" y="248" text-anchor="start" font-size="13" font-weight="400" fill="#686868">全段階に適用</text><text x="380" y="296" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">各段階の実施状況を記録し、説明できるようにする</text><text x="380" y="322" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">委託先には契約で同等の保護を求める</text></g></svg>
