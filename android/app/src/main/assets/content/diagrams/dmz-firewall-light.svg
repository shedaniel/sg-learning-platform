<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 360" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><title>DMZ とファイアウォール</title><desc>インターネットから外部ファイアウォール、DMZ の公開サーバ、内部ファイアウォールを経て社内 LAN に至る多段防御を示す図。</desc><g font-family="sans-serif" font-size="13" fill="#262626"><defs><marker id="dmz-arrow-fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#262626" stroke="none"/></marker><marker id="dmz-arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#686868" stroke="none"/></marker><marker id="dmz-arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009689" stroke="none"/></marker><marker id="dmz-arrow-success" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#007a55" stroke="none"/></marker><marker id="dmz-arrow-warning" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bb4d00" stroke="none"/></marker><marker id="dmz-arrow-error" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c10007" stroke="none"/></marker><marker id="dmz-arrow-c1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f54a00" stroke="none"/></marker><marker id="dmz-arrow-c2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009689" stroke="none"/></marker><marker id="dmz-arrow-c3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#104e64" stroke="none"/></marker><marker id="dmz-arrow-c4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb900" stroke="none"/></marker><marker id="dmz-arrow-c5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker><marker id="dmz-arrow-c6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fe9a00" stroke="none"/></marker></defs><text x="380" y="32" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">公開サービスは DMZ に置き、内部 LAN とはファイアウォールで分離する</text><g fill="#262626"><rect x="20" y="110" width="110" height="80" rx="10" fill="#f5f5f5" fill-opacity="0.65" stroke="#e5e5e5" stroke-width="1.5"/><text x="75" y="148" text-anchor="middle" font-size="13" font-weight="600" fill="#262626">インターネット</text><text x="75" y="166" text-anchor="middle" font-size="13" fill="#686868">不特定多数</text></g><g fill="#262626"><rect x="164" y="110" width="100" height="80" rx="10" fill="#009689" fill-opacity="0.1" stroke="#009689" stroke-width="1.5"/><text x="214" y="148" text-anchor="middle" font-size="13" font-weight="600" fill="#262626">外部 FW</text><text x="214" y="166" text-anchor="middle" font-size="13" fill="#686868">入口を制限</text></g><g fill="#262626"><rect x="294" y="64" width="150" height="192" rx="14" fill="#fe9a00" fill-opacity="0.07" stroke="#fe9a00" stroke-width="1.5"/></g><text x="369" y="88" text-anchor="middle" font-size="15" font-weight="600" fill="#262626">DMZ</text><text x="369" y="106" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">非武装地帯</text><g fill="#262626"><rect x="310" y="116" width="118" height="52" rx="10" fill="#fe9a00" fill-opacity="0.1" stroke="#fe9a00" stroke-width="1.5"/><text x="369" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#262626">Web サーバ</text><text x="369" y="158" text-anchor="middle" font-size="13" fill="#686868">HTTPS 公開</text></g><g fill="#262626"><rect x="310" y="178" width="118" height="52" rx="10" fill="#fe9a00" fill-opacity="0.1" stroke="#fe9a00" stroke-width="1.5"/><text x="369" y="202" text-anchor="middle" font-size="13" font-weight="600" fill="#262626">メール</text><text x="369" y="220" text-anchor="middle" font-size="13" fill="#686868">SMTP 25</text></g><g fill="#262626"><rect x="474" y="110" width="100" height="80" rx="10" fill="#009689" fill-opacity="0.1" stroke="#009689" stroke-width="1.5"/><text x="524" y="148" text-anchor="middle" font-size="13" font-weight="600" fill="#262626">内部 FW</text><text x="524" y="166" text-anchor="middle" font-size="13" fill="#686868">LAN を保護</text></g><g fill="#262626"><rect x="604" y="64" width="136" height="192" rx="14" fill="#f54a00" fill-opacity="0.07" stroke="#f54a00" stroke-width="1.5"/></g><text x="672" y="88" text-anchor="middle" font-size="15" font-weight="600" fill="#262626">社内 LAN</text><text x="672" y="106" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">業務ネットワーク</text><g fill="#262626"><rect x="620" y="116" width="104" height="52" rx="10" fill="#f54a00" fill-opacity="0.1" stroke="#f54a00" stroke-width="1.5"/><text x="672" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#262626">業務サーバ</text><text x="672" y="158" text-anchor="middle" font-size="13" fill="#686868">DB など</text></g><g fill="#262626"><rect x="620" y="178" width="104" height="52" rx="10" fill="#f54a00" fill-opacity="0.1" stroke="#f54a00" stroke-width="1.5"/><text x="672" y="202" text-anchor="middle" font-size="13" font-weight="600" fill="#262626">社内 PC</text><text x="672" y="220" text-anchor="middle" font-size="13" fill="#686868">業務端末</text></g><line x1="130" y1="150" x2="160" y2="150" stroke="#686868" stroke-width="1.5" marker-end="url(#dmz-arrow-muted)" fill="#262626"/><line x1="264" y1="150" x2="290" y2="150" stroke="#686868" stroke-width="1.5" marker-end="url(#dmz-arrow-muted)" fill="#262626"/><line x1="444" y1="150" x2="470" y2="150" stroke="#686868" stroke-width="1.5" marker-end="url(#dmz-arrow-muted)" fill="#262626"/><line x1="574" y1="150" x2="600" y2="150" stroke="#686868" stroke-width="1.5" marker-end="url(#dmz-arrow-muted)" fill="#262626"/><text x="147" y="278" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">HTTPS 443</text><text x="279" y="278" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">443 / 25</text><text x="459" y="278" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">許可のみ</text><text x="589" y="278" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">TCP 443</text><text x="380" y="322" text-anchor="middle" font-size="13" font-weight="400" fill="#686868">DMZ が侵害されても、内部 FW が LAN への横展開を防ぐ</text></g></svg>
